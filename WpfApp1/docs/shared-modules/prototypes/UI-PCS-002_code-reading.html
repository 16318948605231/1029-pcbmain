function fixture(c){
 const ob=(id,target,hex,text,extra={})=>({id,target,hex,text,decoded:true,association:'unique',eci:'none',derived:text,note:'rawNote',...extra});
 let list=[];
 if(c.fixture==='nul')list=[ob('O1',1,'30 30 00 31','00',{derived:'\\x30\\x30\\x00\\x31',note:'nulNote'}),ob('O2',2,null,null,{decoded:false,association:'pending',note:'noRawNote'})];
 if(c.fixture==='gs1')list=[ob('O1',1,'32 30 30 31','2001',{derived:'HRI: (20)01',note:'gsNote'}),ob('O2',2,'31 30 41 1D 32 31 42','10A\u001d21B',{derived:'10A<GS>21B',note:'gsNote'})];
 if(c.fixture==='encoding')list=[ob('O1',1,'E9','é',{eci:'Latin-1 · fixture',derived:'UTF-8: C3 A9',note:'encodingNote'}),ob('O2',2,'E9','',{eci:'unknown · fixture',derived:null,association:'pending',note:'encodingNote'})];
 if(c.fixture==='same')list=[ob('O1',1,'30 30 31 32','0012',{note:'sameNote'}),ob('O2',2,'30 30 31 32','0012',{note:'sameNote'})];
 if(c.fixture==='conflict')list=[ob('O1',1,'30 30 31 32','0012',{association:'pending',note:'conflictNote'}),ob('O2',1,'30 30 31 33','0013',{association:'pending',note:'conflictNote'}),ob('O3',2,'41 32','A2')];
 if(c.fixture==='partial'||c.fixture==='count')list=[ob('O1',1,'30 30 31 32','0012',{association:'pending'}),ob('O2',2,null,null,{decoded:false,association:'pending',note:'noRawNote'})];
 if(c.fixture==='noRaw')list=[ob('O1',1,null,'0012',{note:'noRawNote'}),ob('O2',2,null,'0013',{note:'noRawNote'})];
 return list;
}
function quality(c,kind){
 if(c.family==='dot'||(c.family==='1d'&&c.route==='dpm'))return [];

 if(c.route==='dpm')return [['mean_light','diagnostic','112','dpmMissing'],['overall','marker','N/A','dpmMissing']];
 if(c.family==='1d')return [['overall','grade','2.7','overall'],['reference_decode','grade','0','referenceZero'],['quiet_zone','marker','N/A','na']];
