function startRun(){if(blockedWrite()||pending||!validInput())return;const p={id:'DEMO-RUN-'+(++requestSeq),kind:'run',revision,sourceRevision,draft:structuredClone(draft),cancel:false};pending=p;result=null;notice='running';render();setTimeout(()=>{const rec={...p,state:p.cancel?'cancelled':p.revision!==revision?'late':'complete'};records.push(rec);if(pending===p){pending=null;if(rec.state==='complete'&&writable())result=rec;notice=rec.state;}render();},650);}
function requestCancel(){if(!pending)return;pending.cancel=true;notice='cancelling';render();}
function save(){if(blockedWrite()||pending)return;const op={id:'DEMO-SAVE-'+(++operationSeq),kind:'save',revision,sourceRevision,draft:structuredClone(draft),unknown:saveLost,state:'saved'};saveOperation=op;savedDraft=structuredClone(op.draft);savedSource=op.sourceRevision;savedRevision=op.revision;records.push({...op});notice=saveLost?'saveUnknown':'saved';render();}
function querySave(){if(!saveOperation?.unknown)return;saveOperation.unknown=false;notice='saved';render();}
function checkCertificate(){if(blockedWrite())return;const reason=({missingK:'missingKHint',badHash:'hashHint',badU:'badUHint',duplicateKey:'duplicateHint'})[draft.certCase]||'checked';certCheck={revision,sourceRevision,reason,ok:reason==='checked'};bindingCheck=null;notice=reason;render();}
function checkBinding(){if(blockedWrite()||!certCheck||certCheck.revision!==revision)return;const reason=!certCheck.ok?certCheck.reason:draft.physical!=='REF-017'?'serialHint':draft.purpose!=='height'?'purposeHint':draft.certCase==='expired'?'expiredHint':!draft.conditions?'notBound':'bindingReady';bindingCheck={revision,sourceRevision,ok:reason==='bindingReady',reason};notice=reason;render();}
function downloadCSV(){if(role==='readonly'||fixture==='PermissionDenied'||dialog?.type!=='export')return;const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[['evidence','id','raw_value','raw_unit','canonical_value','canonical_unit','display_value','display_unit','status'],...measurements.map(m=>['SYNTHETIC',m.id,m.raw,'um',m.canonical,'mm',m.value===null?'':(m.value*(dialog.unit==='um'?1000:1)).toFixed(dialog.digits),dialog.unit,m.reason])].map(r=>r.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='DEMO-MET-06.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),0);}
function handle(action,value){switch(action){
case'navigate':navigate(value);return;case'select':selectMeasurement(value);return;case'clear':clearFilter();return;case'reset-state':fixture='Ready';notice='safe';break;
case'cov-filter':covGap=!covGap;break;case'cov-select':covSelected=value;break;
case'source':if(blockedWrite())return;sourceRevision++;invalidate();notice='sourceChanged';break;
case'run':startRun();return;case'cancel':requestCancel();return;case'save':save();return;case'query':querySave();return;
case'check-cert':checkCertificate();return;case'bind-cert':checkBinding();return;
case'close':case'stay':dialog=null;nextTab=null;break;
case'keep':if(pending)pending.cancel=true;tab=nextTab;nextTab=null;dialog=null;notice='safe';break;
case'restore':if(!writable()||pending||saveOperation?.unknown)return;draft=structuredClone(savedDraft);sourceRevision=savedSource;invalidate();tab=nextTab;nextTab=null;dialog=null;notice='safe';break;
case'history-select':historySelected=value;break;
case'export':if(role==='readonly'||fixture==='PermissionDenied')return;dialog={type:'export',unit,digits};break;
case'download':downloadCSV();return;
case'row':dialog={type:'row',row:structuredClone(sampleRows()[Number(value)]),index:Number(value),scenario:draft.scenario,sourceRevision};break;
case'residual':dialog={type:'residual',index:Number(value),report:structuredClone(tab==='history'?records.find(r=>r.id===historySelected):result)};break;
case'cert-field':dialog={type:'cert-field',index:Number(value),draft:structuredClone(draft),sourceRevision};break;
case'handoff':if(!bindingCheck)return;dialog={type:'handoff',check:structuredClone(bindingCheck),draft:structuredClone(draft),sourceRevision};break;
case'cov-evidence':dialog={type:action,row:structuredClone(coverageRows.find(x=>x[0]===covSelected))};break;
case'engineering':dialog={type:action};break;
case'replacement':if(blockedWrite())return;dialog={type:action};break;
default:if(!selectedMeasurement())return;dialog={type:action,measurement:structuredClone(selectedMeasurement())};
}render();}
function bind(){document.querySelectorAll('[data-action]').forEach(el=>{el.addEventListener('click',()=>handle(el.dataset.action,el.dataset.value));if(el.tagName.toLowerCase()==='g')el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handle(el.dataset.action,el.dataset.value);}});});
 const change=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener('change',fn);};
 change('lang',e=>{lang=e.target.value;render();});change('theme',e=>{theme=e.target.value;render();});change('role',e=>{role=e.target.value;if(!writable()&&pending)pending.cancel=true;render();});change('fixture',e=>{fixture=e.target.value;if(fixture==='PermissionDenied'&&pending)pending.cancel=true;render();});
 change('dialog-lang',e=>{lang=e.target.value;render();});change('dialog-theme',e=>{theme=e.target.value;render();});
 change('search',e=>{queryText=e.target.value;selectionSeq++;loading=false;if(!viewRows().some(m=>m.id===selection))selection=null;render();});change('unit',e=>{unit=e.target.value;render();});change('digits',e=>{digits=Number(e.target.value);render();});change('zoom',e=>{zoom=Number(e.target.value);render();});
 for(const [id,key] of [['scenario','scenario'],['level','level'],['policy','policy'],['confidence','confidence'],['purpose','purpose'],['physical','physical']]){const el=document.getElementById(id);if(el){el.disabled=blockedWrite();change(id,e=>updateDraft(key,e.target.value));}}
 change('cert-case',e=>{if(blockedWrite())return;draft.certCase=e.target.value;draft.physical=draft.certCase==='wrongSerial'?'REF-999':'REF-017';draft.conditions=false;invalidate();render();});const cc=document.getElementById('cert-case');if(cc)cc.disabled=blockedWrite();
 change('conditions',e=>updateDraft('conditions',e.target.checked));const cond=document.getElementById('conditions');if(cond)cond.disabled=blockedWrite();change('save-lost',e=>{saveLost=e.target.checked;});
}
document.addEventListener('keydown',e=>{if(e.altKey&&/^[1-5]$/.test(e.key)&&!dialog){e.preventDefault();navigate(['measure','coverage','study','certificate','history'][Number(e.key)-1]);}});
window.metrologySnapshot=()=>structuredClone({lang,theme,role,fixture,tab,queryText,selection,loading,unit,digits,revision,sourceRevision,draft,savedRevision,pending,result,certCheck,bindingCheck,saveOperation,records,dirty:dirty(),measurements,required:6});
render();
</script></body></html>
