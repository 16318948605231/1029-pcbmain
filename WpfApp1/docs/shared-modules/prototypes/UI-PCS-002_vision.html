function matchingDraw(s){const svg=document.querySelector('#m-stage');if(!svg)return;const m=s.match;if(!s.frame||!canRead(s)){svg.innerHTML='';return;}const f=m.config.features[m.slot],domain=m.drag?[m.drag.start[0],m.drag.start[1],m.drag.end[0]-m.drag.start[0],m.drag.end[1]-m.drag.start[1]]:m.config.domain;let selected=m.search?.explanations.find(e=>e.id===m.selected);svg.innerHTML=`<g id="m-world" transform="translate(0,10)">${boardSvg()}<rect x="${domain[0]}" y="${domain[1]}" width="${Math.abs(domain[2])}" height="${Math.abs(domain[3])}" fill="#eabc6512" stroke="#eabc65" stroke-dasharray="8 5" stroke-width="2"/><rect x="${f.rect[0]}" y="${f.rect[1]}" width="${f.rect[2]}" height="${f.rect[3]}" fill="#5dcdeb20" stroke="#5dcdeb" stroke-width="2"/><path d="M${f.origin[0]-10} ${f.origin[1]}h20 M${f.origin[0]} ${f.origin[1]-10}v20" stroke="#fff" stroke-width="2"/>${(m.search?.explanations||[]).map(e=>{const pts=e.ids.map(id=>m.search.candidates.find(c=>c.id===id));return`<polyline points="${pts.map(c=>[c.x,c.y].join(',')).join(' ')}" stroke="${e.id===m.selected?'#fff':'#ffb967'}" opacity="${e.id===m.selected?1:.45}" stroke-width="${e.id===m.selected?4:2}" fill="none"/>`;}).join('')}${(m.search?.candidates||[]).map(c=>`<g data-action="m:candidate" data-value="${c.id}" tabindex="0" role="button" aria-label="${c.id}" style="cursor:pointer"><circle cx="${c.x}" cy="${c.y}" r="${m.candidate===c.id?13:9}" fill="${selected?.ids.includes(c.id)?'#e7f9ff':'#72d7e4'}" stroke="#123443" stroke-width="2"/><text x="${c.x+12}" y="${c.y-10}" fill="#fff" font-size="13">${c.id}</text></g>`).join('')}${(m.frameReview&&m.frameReview.key===mReviewKey(s)&&!mEvidenceReason(s,m.frameReview.evidence)?m.frameReview.evidence.points:[]).map(p=>`<g><path d="M${p.nominal[0]-6} ${p.nominal[1]}h12 M${p.nominal[0]} ${p.nominal[1]-6}v12" stroke="#fbc670" stroke-width="2"/>${p.observations.map(o=>`<circle cx="${o.position[0]}" cy="${o.position[1]}" r="7" fill="none" stroke="#c8ff87" stroke-width="2"/>`). if(Object.values(r).some(v=>!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(v))||!Object.values(n).every(Number.isFinite)||!goodRect(rect)||!goodRect(domain)||n.ox<rect[0]||n.ox>rect[0]+rect[2]||n.oy<rect[1]||n.oy>rect[1]+rect[3]||n.score<0||n.score>1||!Number.isInteger(n.budget)||n.budget<1||n.budget>1000){m.error='mBad';render();return;}
const f=m.config.features[m.slot];f.rect=rect;f.origin=[n.ox,n.oy];m.config.domain=domain;m.config.score=n.score;m.config.budget=n.budget;m.revision++;m.rawDirty=false;m.error=null;mInvalidate(s);render();}
function mSearchResult(s,j){const m=s.match,domain=m.config.domain,oa=m.config.features.A.origin,ob=m.config.features.B.origin,all=[{id:'C1',slot:'A',x:oa[0],y:oa[1],score:.94},{id:'C2',slot:'B',x:ob[0],y:ob[1],score:.87},{id:'C3',slot:'A',x:oa[0]+40,y:oa[1],score:.96},{id:'C4',slot:'B',x:ob[0]+40,y:ob[1],score:.89}];let candidates=all.filter(c=>c.score>=m.config.score&&c.x>=domain[0]&&c.x<=domain[0]+domain[2]&&c.y>=domain[1]&&c.y<=domain[1]+domain[3]);if(m.scenario==='missing')candidates=candidates.filter(c=>c.slot!=='B');if(m.scenario==='empty')candidates=[];const explanations=[{id:'E1',ids:['C1','C2'],dx:0,dy:0},{id:'E2',ids:['C3','C4'],dx:40,dy:0}].filter(e=>e.ids.every(id=>candidates.some(c=>c.id===id)));m.search={id:j.id,key:mKey(s),source:mSource(s),config:copy(m.config),models:copy(m.models),candidates,explanations,complete:m.scenario!=='truncated'&&m.config.budget>=80,missing:candidates.length>0&&!['A','B'].every(k=>candidates.some(c=>c.slot===k)),quality:m.scenario!=='quality'};m.selected=null;m.candidate=null;m.frameReview=null;m.stale=false;}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action^="m:"]');if(!el||el.disabled)return;const s=S(),m=s.match,a=el.dataset.action.slice(2);if(!canRead(s))return;

if(a==='save'){if(!m.search||m.search.explanations.length>0&&!m.selected||mUnknown(m))return;const op={id:`MATCH-SAVE-${s.name}-${++m.seq}`,source:mSource(s),frame:copy(s.frame),selection:m.selected,key:mDecisionKey(s),payload:copy({config:m.config,search:m.search,frameReview:m.frameReview,modelQualificationExample:m.modelQualificationExample,evidenceCase:m.evidenceCase}),status:'sending'};m.saveOp=op;setTimeout(()=>{op.status='unknown';if(active===s.name)render();},350);render();return;}
