$('image').innerHTML=`<defs><clipPath id="viewClip"><rect x="${x.view==='crop'?125:0}" y="${x.view==='crop'?y[sel]-55:0}" width="${x.view==='crop'?470:720}" height="${x.view==='crop'?110:400}"/></clipPath><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="#c18f42" stroke-width="3"/></pattern></defs><g clip-path="url(#viewClip)"><rect width="720" height="400" fill="#101e28"/><rect x="32" y="30" width="650" height="340" rx="12" fill="#11382f" stroke="#3d6555"/>${lines}${chips}${gap}${tile}<circle cx="63" cy="59" r="10" fill="#102a25" stroke="#b19c65" stroke-width="5"/><circle cx="650" cy="340" r="10" fill="#102a25" stroke="#b19c65" stroke-width="5"/></g>`;
}
function target(i){s().selected=i;render();}document.addEventListener('click',e=>{const b=e.target.closest('[data-target]');if(b)target(+b.dataset.target);});
function job(kind){const x=s();if(!canEdit(x)||!x.frame||x.dirty||live(x))return;const gen=x.generation,id=`SIM-${x.host}-${++serial}`,selection=x.selected,mode=x.mode,scenario=x.scenario;const j={id,gen,kind,cancelled:false};x.jobs.push(j);event(x,'started',id);render();setTimeout(()=>{x.jobs=x.jobs.filter(q=>q!==j);if(j.cancelled||gen!==x.generation||!canEdit(x)){event(x,'lateIgnored',id);render();return;}if(kind==='recover'){x.results[2]={...x.results[2],recovered:'R1',source:x.results[2].source+' + RECOVERY-1'};x.evidenceRev++;event(x,'recovered',id);}else{const make=i=>{const base={raw:null,score:null,status:'detected',glyph:false,source:`SIM-F${x.frame}/${ids(x)[i]}/${id}`};if(mode==='detection')return base;if(scenario==='empty')return{...base,raw:'',score:0,status:'blank'};if(scenario==='missing'&&i>0)return{...base,status:i===1?'missing':'domain'};return{...base,...[{raw:'O01',score:.93,status:'read',glyph:true},{raw:'AB8',score:.41,status:'low'},{raw:null,score:null,status:'conflict',source:'TILE-A:R1 + TILE-B:R7'}][i]};};if(mode==='recognition')x.results[selection]=make(selection);else x.results=[0,1,2].map(make);x.evidenceRev++;event(x,'done',id);}render();},x.delay==='late'?2400:450);}
$('load').onclick=()=>{const x=s();if(!canEdit(x)||x.saveOp?.status==='pending')return;invalidate(x,'loaded');x.frame=++x.frameSerial;x.recovery=0;render();};$('run').onclick=()=>{if(!$('run').disabled)job('run');};$('cancel').onclick=()=>{const x=s();if(!canEdit(x))return;x.generation++;for(const j of x.jobs)j.cancelled=true;event(x,'cancelled');render();};
$('recover').onclick=()=>{const x=s();if($('recover').disabled)return;if(x.budget<12000){event(x,'overBudget');render();return;}x.recovery++;job('recover');};
$('budget').oninput=()=>{const x=s();if(!canEdit(x))return;x.budgetText=$('budget').value;x.dirty=true;invalidate(x,'dirty');render();};$('apply').onclick=()=>{const x=s();if(!canEdit(x)||!x.dirty)return;if(!/^[1-9]\d*$/.test(x.budgetText)||+x.budgetText>100000){event(x,'invalid');render();return;}x.budget=+x.budgetText;x.dirty=false;x.rev++;invalidate(x,'applied');render();};
for(const k of ['model','mode','scenario'])$(k).onchange=()=>{const x=s();if(!canEdit(x))return;x[k]=$(k).value;x.rev++;invalidate(x);render();};for(const k of ['transport','delay'])$(k).onchange=()=>{if(canEdit(s()))s()[k]=$(k).value;};
$('save').onclick=()=>{const x=s();if($('save').disabled)return;const op={id:`SIM-DRAFT-${x.host}-${++serial}`,signature:sig(x),status:'pending',payload:JSON.parse(JSON.stringify({frame:x.frame,rev:x.rev,model:x.model,mode:x.mode,scenario:x.scenario,budget:x.budget,results:x.results,recovery:x.recovery}))};x.saveOp=op;const transport=x.transport;event(x,'saving',op.id);render();setTimeout(()=>{op.status=transport==='unknown'?'unknown':'saved';event(x,op.status==='unknown'?'unknown':'saved',op.id);render();},450);};
$('query').onclick=()=>{const x=s();if(x.role==='denied'||x.saveOp?.status!=='unknown')return;x.saveOp.status='saved';event(x,'queried',x.saveOp.id);render();};
$('host').onchange=()=>{const old=s();old.generation++;old.jobs.forEach(j=>j.cancelled=true);active=$('host').value;event(s(),'hostChanged');render();};$('role').onchange=()=>{const x=s();x.role=$('role').value;x.generation++;x.jobs.forEach(j=>j.cancelled=true);if(x.role==='denied'){invalidate(x);x.frame=0;x.log=[];}event(x,'accessChanged');render();};$('lang').onchange=()=>{lang=$('lang').value;render();};$('filter').onchange=()=>{s().filter=$('filter').value;render();};
for(const k of ['original','crop'])$(k).onclick=()=>{s().view=k;render();};$('fit').onclick=()=>{s().view='original';render();};$('support').onclick=()=>{s().showSupport=!s().showSupport;render();};$('tiles').onclick=()=>{s().showTiles=!s().showTiles;render();};$('derived').onchange=()=>{s().derived=$('derived').checked;render();};$('prev').onclick=()=>target((s().selected+2)%3);$('next').onclick=()=>{let i=s().selected;for(let n=1;n<=3;n++){let k=(i+n)%3,r=s().results[k];if(!r||r.status!=='read'||r.glyph){target(k);break;}}};
$('image').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();target((s().selected+(e.key==='ArrowRight'?1:2))%3);}if(e.key==='Enter'){e.preventDefault();s().view='crop';render();}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&live(s())&&canEdit(s()))$('cancel').click();});
window.ocrSnapshot=()=>JSON.parse(JSON.stringify({active,lang,sessions}));render();
</script></body></html>
