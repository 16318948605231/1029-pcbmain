const title=bad?(left?t('rawA'):t('rawB')):n===62?(left?t('countType'):t('inspectionDetails')):left?t('volume'):t('bridge');return `<div class="evidence"><div class="evidencecap"><strong>${t(left&&bad?'leftPre':side)}</strong><span class="mono tiny">${left?(bad?'AOI-PRE-04':'SPI-04'):'AOI-07'}</span></div><div class="board"><div class="chip ${left?'':'aoi'}"><span class="pad"></span><span class="pad"></span><span class="pad"></span></div><span class="boardlabel">${t('sample')}</span></div><div class="evidencedata"><span class="tiny muted">${title}</span><strong>${val}</strong><dl><dt>${t('attempt')}</dt><dd class="mono">${n===3&&!left?'AOI-RECHECK-02':left?(bad?'PRE-01 / AOI-PRE-01':'PRINT-01 / SPI-01'):'REFLOW-01 / AOI-01'}</dd><dt>${t('eventTime')}</dt><dd class="mono">${left?'09:04:12':'09:12:41'}</dd><dt>${t('knownTime')}</dt><dd class="mono">${left?'09:04:15':'09:13:02'}</dd><dt>${t('sourceFact')}</dt><dd class="mono">${missing?'—':`${left?(bad?'PRE-AOI':'SPI'):'AOI'}-F${String(n).padStart(4,'0')}-r1`}</dd></dl></div></div>`}
function timelineView(){return `<div class="subgrid"><article class="panel"><div class="panelhead row between"><h2>${t('historyTitle')}</h2>${pill(S.rev==='R1'?'r1':'r2')}</div><div class="panelbody"><p class="muted">${t('historyNote')}</p></div><div class="timeline"><div class="event"><span class="dot"></span><div><h3>${t('capture')}</h3><p>${t('captureText')}</p><small class="mono muted">${t('knownTime')} · 09:20</small></div></div><div class="event"><span class="dot"></span><div><h3>${t('lateTitle')}</h3><p>${t('lateText')}</p><small class="mono muted">${t('eventTime')} · 09:12 / ${t('knownTime')} · 09:28</small></div></div><div class="event"><span class="dot"></span><div><h3>${t('newAnalysis')}</h3><p class="muted">${t('frozen')}</p>${button('successor','successor','primary',`id="successor" ${S.busy||S.draining?'disabled':''}`)}</div></div></div></article><aside class="panel"><div class="panelhead"><h2>${t('timeExample')}</h2></div><div class="panelbody stack"><div class="notice blue">${t('timeExplain')}</div><table><thead><tr><th>${t('history')}</th><th>${t('eventTime')}</th><th>${t('current')}</th></tr></thead><tbody><tr><td>R1</td><td>19</td><td>V1</td></tr><tr><td>R2</td><td>19</td><td>V2</td></tr></tbody></table><p class="tiny muted">${t('prototype')}</p></div></aside></div>`}
function statsView(){const c=counts();return `<div class="subgrid"><section class="panel"><div class="panelhead"><h2>${t('populationTitle')}</h2></div><div class="panelbody"><div class="tablewrap"><table><thead><tr><th>${t('set')}</th><th>${t('count')}</th><th>${t('reason')}</th></tr></thead><tbody>${[['expected',100,'boards'],['related',c.related,'yes'],['gap',100-c.related,'unpairedReason'],['notcompare',4,'incompatibleReason'],['usable',c.used,'defined']].map(([key,num,why])=>`<tr><td>${t(key)}</td><td class="mono">${num}</td><td>${t(why)}</td></tr>`).join('')}</tbody></table></div><h3 style="margin-top:18px">${t('method')}</h3><p class="muted">${t('methodText')}</p>${Number(S.resultMin)>c.used?`<div class="notice" id="low-sample">${t('sampleLow')}</div>`:''}<div class="notice blue" style="margin-top:16px"><b>${t('metricTruth')}</b><p>${t('metricTruthText')}</p></div></div></section><section class="panel"><div class="panelhead"><h2>${t('strata')}</h2></div><div class="panelbody"><div class="tablewrap"><table><thead><tr><th></th><th>${t('old')}</th><th>${t('new')}</th></tr></thead><tbody><tr><td>A</td><td>9/10 · 90%</td><td>80/100 · 80%</td></tr><tr><td>B</td><td>60/100 · 60%</td><td>5/10 · 50%</td></tr><tr><td>${t('total')}</td><td>69/110 · 62.7%</td><td>85/110 · 77.3%</td></tr></tbody></table></div><div class="barrow"><span>${t('old')}</span><div class="bar"><span style="width:62.7%"></span></div><span>62.7%</span></div><div class="barrow"><span>${t('new')}</span><div class="bar"><span style="width:77.3%;background:var(--teal)"></span></div><span>77.3%</span></div><div class="notice">${t('paradox')}</div></div></section></div>`}
function reportView(){const c=currentRecord()?.counts||counts(),r=currentRecord();return `<section class="panel"><div class="panelhead row between"><h2>${t('report')}</h2>${button('report','reportAction','primary')}</div><div class="panelbody"><div class="reportpaper"><div class="eyebrow">QUALITY / ${S.rev}</div><h2 style="font-size:22px">${t('handoff')}</h2><div class="rule"></div><p>${t('reportNote')}</p><dl class="facts"><dt>${t('snapshot')}</dt><dd class="mono">QA-021-${S.rev}-C${S.calc} / ${S.rev==='R1'?'CUT-0920':'CUT-0930'}</dd><dt>${t('scope')}</dt><dd>${t('reportScope')}</dd><dt>${t('expected')} / ${t('related')} / ${t('usable')}</dt><dd class="mono">${c.expected} / ${c.related} / ${c.used}</dd><dt>${t('use')}</dt><dd>${t('investigation')}</dd><dt>${t('queryRole')}</dt><dd class="mono">042 → 045 → 046</dd>${r?`<dt>${t('minimum')}</dt><dd class="mono">${r.min}</dd>`:''}</dl><div class="mutedbox" style="margin-top:24px">${t('reportReadonly')}</div>${S.reportIntent?`<p class="notice blue" style="margin-top:12px">${t('handoffSaved')}<br><span class="mono">${S.reportIntent.analysis} · ${S.reportIntent.counts.expected}/${S.reportIntent.counts.related}/${S.reportIntent.counts.used} · ${t('minimum')} ${S.reportIntent.min} · ${S.reportIntent.source}</span></p>`:''}</div></div></section>`}
function select(n){if(!S.read)return;S.selected=n;S.loading=true;S.readError=false;const token=++S.request;const rs=rows();const index=rs.indexOf(n);if(index>=0)S.page=Math.floor(index/8);render();setTimeout(()=>{if(token!==S.request||!S.read)return;S.loaded=n;S.loading=false;render()},S.slow?1600:350)}
function run(){if(!S.read||S.busy||S.draining)return;S.busy=true;S.phase=0;S.statusKey='idle';const request={min:S.min,note:S.note,rev:S.rev};const token=++S.runToken;render();setTimeout(()=>{if(token!==S.runToken||!S.read)return;S.phase=1;render()},450);setTimeout(()=>{if(token!==S.runToken||!S.read)return;S.busy=false;const newCalc=++S.nextCalc[request.rev];S.calc=newCalc;S.resultMin=request.min;S.analysisRecords[request.rev+'-C'+newCalc]=freeze({...request,calc:newCalc,...sourceCuts[request.rev]});S.dirty=S.min!==request.min||S.note!==request.note;S.statusKey='calcDone';persist();render()},1100)}
function cancel(){if(!S.busy||S.draining)return;S.draining=true;++S.runToken;render();setTimeout(()=>{S.busy=false;S.draining=false;S.statusKey='canceled';render()},500)}
function save(){if(!S.read||S.busy||S.draining||S.dirty)return;if(['unknown','querying'].includes(S.saveOp?.state)){toast('noNewSave');return}S.saveOp={id:`SAVE-Q021-${S.rev}-C${S.calc}-${Date.now().toString(36)}`,rev:S.rev,calc:S.calc,min:S.resultMin,counts:counts(),state:'unknown'};persist();render()}
function receipt(){if(!S.read||!S.saveOp||S.saveOp.state==='querying')return;const op=S.saveOp;const token=++S.receiptToken;op.state='querying';persist();render();setTimeout(()=>{if(token!==S.receiptToken||!S.read)return;op.state='committed';S.statusKey='saved';persist();render();toast('saved')},450)}
function revoke(){S.read=false;S.request++;S.receiptToken++;if(S.saveOp?.state==='querying')S.saveOp.state='unknown';S.loading=false;S.readError=false;if(S.busy)cancel();S.modal=null;$('dialog').close();$('dialog-body').innerHTML='';$('dialog-foot').innerHTML='';$('toast').hidden=true;S.checked.clear();persist();render()}
function restore(){S.read=true;S.statusKey='idle';render();select(S.selected)}
function changeRevision(rev){if(!S.read||S.busy||S.draining)return;S.rev=rev;S.request++;S.loading=false;S.loaded=S.selected;const records=Object.values(S.analysisRecords).filter(r=>r.rev===rev).sort((a,b)=>a.calc-b.calc);const latest=records[records.length-1];S.calc=latest?.calc||0;S.resultMin=latest?.min||'30';S.dirty=S.min!==S.resultMin||S.note!==(latest?.note||'');S.statusKey='idle';render()}
let opener=null,openerAction=null;
function openModal(type){if(!S.read)return;opener=document.activeElement;openerAction=opener?.dataset?.action;S.modal=type;if(type==='proposal')S.proposalPreview=projectProposal(S.checked.size?[...S.checked]:[S.loaded],currentRecord());if(type==='report')S.reportPreview=currentRecord();renderModal(true);$('dialog').showModal();const first=$('dialog-body').querySelector('input,textarea,button');(first||$('dialog-foot').querySelector('button'))?.focus()}
function closeModal(){S.modal=null;$('dialog').close();persist();render();if(opener?.isConnected)opener.focus();else if(openerAction)document.querySelector(`[data-action="${openerAction}"]`)?.focus();else $('tab-'+S.tab)?.focus()}
function renderModal(first){const type=S.modal;if(!type)return;const focus=document.activeElement;const selection=focus?.id?{id:focus.id,start:focus.selectionStart,end:focus.selectionEnd}:null;const c=counts();let title='',body='',foot='';
if(type==='configure'){title='configTitle';body=`<div class="notice blue">${t('scopePolicy')} <span class="mono">JOIN-Q7 / TIME-T2</span><br>${t('bound')}</div><label class="field"><b>${t('minimum')}</b><input id="minimum" inputmode="numeric" type="text" maxlength="4" value="${esc(S.draft.min)}" aria-describedby="min-help config-error"><span id="min-help">${t('minimumHelp')}</span></label><label class="field"><b>${t('note')}</b><textarea id="config-note" maxlength="500">${esc(S.draft.note)}</textarea></label><div id="config-error" class="error" role="alert">${S.configError?t('invalid'):''}</div>`;foot=button('discard','discard')+button('close','keep')+button('apply','apply','primary');}
if(type==='identity'){title='identityTitle';body=`<dl class="facts"><dt>${t('longId')}</dt><dd class="mono" id="full-identity">${physical(S.loaded)}</dd><dt>${t('bodySide')}</dt><dd>TOP</dd><dt>${t('attempt')}</dt><dd class="mono">${S.loaded>=57&&S.loaded<=60?'PRE-01 / AOI-PRE-01':'PRINT-01 / SPI-01'} → REFLOW-01 / AOI-01</dd><dt>${t('policy')}</dt><dd class="mono">JOIN-Q7 / TIME-T2 / MAP-N7-C-r3</dd><dt>${t('snapshot')}</dt><dd class="mono">QA-021-${S.rev}-C${S.calc}</dd></dl>`;foot=button('close','close');}
if(type==='disposition'){title='originalDisposition';body=`<div class="notice">${t(S.loaded===3?'repairNote':'frozen')}</div><dl class="facts"><dt>${t('repairAction')}</dt><dd>${t(S.loaded===3?'actionComplete':'no')}</dd><dt>${t('inspectionPlan')}</dt><dd>${t(S.loaded===3?'missingNeighbor':'no')}</dd><dt>${t('decision')}</dt><dd>${t('no')}</dd><dt>${t('movement')}</dt><dd>${t('noDevice')}</dd></dl>`;foot=button('close','close');}
if(type==='proposal'){const preview=S.proposalPreview;const usable=preview.items.filter(x=>x.eligible).map(x=>x.n);const skipped=preview.items.filter(x=>!x.eligible).map(x=>x.n);title='proposalTitle';body=`<div class="notice blue">${t('proposalHelp')}</div><div class="mono" id="proposal-analysis">${preview.analysis} / ${preview.source}</div><p><b>${t('eligible')}: ${usable.length}</b> / ${t('skipped')}: ${skipped.length}</p><div class="mono mutedbox" id="proposal-included">${usable.map(n=>id(n)+' · '+t('available')).join(' / ')||'—'}</div>${skipped.length?`<div class="notice" id="proposal-skipped">${t('skipped')}: ${skipped.map(id).join(' · ')}</div>`:''}<label class="field"><b>${t('note')}</b><textarea id="proposal-note" maxlength="500">${esc(S.proposalNote)}</textarea><span>${t('reasonRequired')}</span></label><div class="error" id="proposal-error" role="alert"></div>`;foot=button('close','keep')+button('proposal-save','saveDraft','primary',!usable.length?'disabled':'');}
if(type==='report'){const r=S.reportPreview,rc=r.counts;title='reportAction';body=`<div class="notice blue">${t('reportNote')}</div><dl class="facts"><dt>${t('snapshot')}</dt><dd class="mono">QA-021-${r.rev}-C${r.calc} / ${r.source}</dd><dt>${t('scope')}</dt><dd>${rc.expected} / ${rc.related} / ${rc.used}</dd><dt>${t('use')}</dt><dd>${t('investigation')}</dd><dt>${t('queryRole')}</dt><dd>042 / 045 / 046</dd>${r?`<dt>${t('minimum')}</dt><dd class="mono">${r.min}</dd><dt>${t('note')}</dt><dd>${esc(r.note)||'—'}</dd>`:''}</dl><p>${t('reportReadonly')}</p>`;foot=button('close','close')+button('handoff','handoffButton','primary');}
$('dialog-title').textContent=t(title);$('dialog-body').innerHTML=body;$('dialog-foot').innerHTML=foot;$('dialog-lang').value=S.lang;if(!first&&selection&&$(selection.id)){const e=$(selection.id);e.focus();try{e.setSelectionRange(selection.start,selection.end)}catch{}}
}
function action(a){if(a==='restore'){restore();return}if(!S.read)return;
if(a.startsWith('tab:')){S.tab=a.split(':')[1];render();$('tab-'+S.tab)?.focus();return}
if(a.startsWith('select:')){const n=Number(a.split(':')[1]);if(!rows().includes(n)){S.search='';S.filter='all'}select(n);return}
if(['configure','identity','disposition','proposal','report'].includes(a)){openModal(a);return}
if(a==='clear'){S.search='';S.filter='all';S.page=0;render();return}
if(a==='prev'||a==='next'){S.page+=a==='prev'?-1:1;render();return}
if(a==='run'){run();return}if(a==='retry'){S.readError=false;select(S.selected);return}
if(a==='successor'){S.late=true;S.hasR2=true;changeRevision('R2');return}
if(a==='close'){const draft=['configure','proposal'].includes(S.modal);closeModal();if(draft)toast('draftKept');return}
if(a==='discard'){S.configError=false;S.draft={min:S.min,note:''};closeModal();return}
if(a==='apply'){if(!/^[1-9]\d{0,2}$/.test(S.draft.min)||Number(S.draft.min)>100){S.configError=true;$('config-error').textContent=t('invalid');$('minimum').setAttribute('aria-invalid','true');$('minimum').focus();return}S.configError=false;S.min=S.draft.min;S.note=S.draft.note;S.dirty=S.min!==S.resultMin||S.note!==currentRecord().note;closeModal();toast('draftApplied');return}
if(a==='proposal-save'){const preview=S.proposalPreview;if(!preview||!preview.items.some(x=>x.eligible))return;if(!S.proposalNote.trim()){$('proposal-error').textContent=t('reasonRequired');$('proposal-note').focus();return}S.proposalDraft=freeze({...preview,ids:preview.items.filter(x=>x.eligible).map(x=>x.n),note:S.proposalNote});closeModal();toast('proposalSaved');return}
if(a==='handoff'){const r=S.reportPreview;if(!r)return;S.reportIntent=freeze({analysis:'QA-021-'+r.rev+'-C'+r.calc,counts:r.counts,min:r.min,note:r.note,source:r.source});closeModal();toast('handoffSaved');return}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)action(b.dataset.action)});
document.addEventListener('input',e=>{if(e.target.id==='search'){S.search=e.target.value;S.page=0;render()}if(e.target.id==='minimum'){S.draft.min=e.target.value;S.configError=false;persist();$('config-error').textContent='';e.target.removeAttribute('aria-invalid')}if(e.target.id==='config-note'){S.draft.note=e.target.value;persist()}if(e.target.id==='proposal-note')S.proposalNote=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='filter'){S.filter=e.target.value;S.page=0;render()}if(e.target.id==='history-select')changeRevision(e.target.value);if(e.target.id==='calculation-select'&&S.read&&!S.busy&&!S.draining){S.calc=Number(e.target.value);S.resultMin=currentRecord().min;S.dirty=S.min!==S.resultMin||S.note!==currentRecord().note;render()}if(e.target.dataset.check){const n=Number(e.target.dataset.check);e.target.checked?S.checked.add(n):S.checked.delete(n);render()}if(['lang','dialog-lang'].includes(e.target.id)){S.lang=e.target.value;persist();render()}});
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['relation','timeline','stats','report'];let i=tabs.indexOf(S.tab);i=e.key==='Home'?0:e.key==='End'?3:(i+(e.key==='ArrowRight'?1:3))%4;action('tab:'+tabs[i])}});
$('dialog').addEventListener('cancel',e=>{e.preventDefault();action('close')});$('theme').onclick=()=>{S.dark=!S.dark;persist();render()};$('save').onclick=save;$('receipt').onclick=receipt;$('cancel').onclick=cancel;$('revoke').onclick=revoke;$('restore').onclick=restore;$('slow').onclick=()=>{S.slow=!S.slow;toast(S.slow?'slowOn':'slowOff')};$('late').onclick=()=>{S.late=true;render();toast('lateReady')};$('readfail').onclick=()=>{if(!S.read)return;S.request++;S.loading=false;S.readError=true;render()};
if(S.saveOp?.state==='querying')S.saveOp.state='unknown';
// Read-only test projection: no direct state mutation or production adapter.
window.qualitySnapshot=()=>({lang:S.lang,rev:S.rev,tab:S.tab,counts:counts(),selected:S.selected,loaded:S.loaded,loading:S.loading,read:S.read,busy:S.busy,draining:S.draining,calc:S.calc,min:S.min,resultMin:S.resultMin,reportIntent:S.reportIntent,draft:{...S.draft},dirty:S.dirty,saveOp:S.saveOp?JSON.parse(JSON.stringify(S.saveOp)):null,proposalDraft:S.proposalDraft,analysisRecords:JSON.parse(JSON.stringify(S.analysisRecords)),modal:S.modal,filter:S.filter,visible:rows().length,status:status()[0]});
render();
</script></body></html>
