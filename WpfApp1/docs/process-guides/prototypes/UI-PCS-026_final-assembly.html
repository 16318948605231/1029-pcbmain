let language='zh-CN',role='engineer',mode='production',entity='E1',target='CAV-01',view='top',smallPanel='image';

const immutable=v=>{Object.freeze(v);for(const x of Object.values(v))if(x&&typeof x==='object'&&!Object.isFrozen(x))immutable(x);return v};
const sources=immutable({E1:{serial:'00128',slots:{A:'P1',B:'P2'},oldSlots:{A:'P1',B:'P0'},attempt:'A07',historyAttempt:'A06',relation:'REL-r7',historyRelation:'REL-r6'},E2:{serial:'00129',slots:{A:'P3',B:'P4'},oldSlots:{A:'P3',B:'P4-OLD'},attempt:'A02',historyAttempt:'A01',relation:'REL-r4',historyRelation:'REL-r3'}});

function newDraft(){return {revision:8,savedRevision:8,validated:0,trial:0,reviewed:0,handoff:0,params:structuredClone(baseline),savedParams:structuredClone(baseline),state:'Ready',message:'readyHint',partialSteps:0,receiptId:null,receiptResolved:false,owner:{canEdit:true,canSave:true,canRun:true,canSubmit:true,concurrency:'expectedRevision'}}}
const drafts={E1:newDraft(),E2:newDraft()};const m=()=>drafts[entity];const item=()=>targets.find(x=>x.id===target);
function context(){const s=sources[entity],history=mode==='history';return {entity,mode,attempt:history?s.historyAttempt:s.attempt,relation:history?s.historyRelation:s.relation,program:history?6:7,bom:history?6:7,slots:history?s.oldSlots:s.slots,target,view,heightInput}}
function selectionKey(){return JSON.stringify(context())}function loaded(){return !!target&&loadedKey===selectionKey()}
function canWrite(){return mode==='engineering'&&role==='engineer'&&m().state!=='PermissionDenied'}
function canEdit(){return canWrite()&&m().owner.canEdit&&(!activeRun||activeRun.entity!==entity)}
function canSave(){return canWrite()&&m().owner.canSave}
function configIssue(){const p=m().params;return p.heightRequired&&p.reference==='missing'?'referenceBlocked':p.labelSource==='missing'?'sourceBlocked':null}
function canRun(){return canWrite()&&m().owner.canRun&&!activeRun&&m().validated===m().revision&&!configIssue()&&newInputs&&budget&&(!m().params.heightRequired||heightInput)}
function canCancel(){return !!activeRun&&activeRun.cancelAllowed&&!activeRun.cancelled}
function canHandoff(){const d=m();return canWrite()&&d.owner.canSubmit&&!activeRun&&d.validated===d.revision&&d.trial===d.revision&&d.reviewed===d.revision&&d.savedRevision===d.revision}
function visible(){if(m().state==='Empty')return [];let a=targets.filter(x=>(filter==='all'||filter==='issues'&&!['linked','observed'].includes(x.state)||filter==='unknown'&&['unknown','partial','mixed'].includes(x.state))&&(x.id+' '+t(x.label)).toLowerCase().includes(search.toLowerCase()));return sort==='reverse'?a.reverse():a}
function toast(key){toastKey=key;$('toast').textContent=t(key);$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{$('toast').hidden=true;toastKey=null},3000)}
function requestSelection(id,focusId){if(id&&!targets.some(x=>x.id===id))return;target=id;if(!item()||item().kind!=='cavity'&&view==='height'||item().kind!=='screw'&&view==='side')view='top';loadedKey=null;const sequence=++requestSeq,key=selectionKey();render();if(focusId)$(focusId)?.focus({preventScroll:true});if(!target)return;setTimeout(()=>{if(requestSeq!==sequence||selectionKey()!==key){discardCount++;renderStatus();return}loadedKey=key;render()},slow&&target==='CAV-01'?1700:140)}

function startTrial(diagnostic=false){if(activeRun||!diagnostic&&!canRun())return;const d=m();const run={entity,revision:d.revision,operationId:'DEMO-TRIAL-'+entity+'-'+(++runNumber),owner:'DEMO-EXEC-OWNER',cancelAllowed:true,cancelled:false,resources:3,steps:0,diagnostic,frozenInput:{newInputs,budget,heightInput,context:context()},timer:null};activeRun=run;d.state='Busy';d.message='busyHint';d.partialSteps=0;render();function tick(){if(activeRun!==run)return;run.steps++;d.partialSteps=run.steps;if(run.steps>=4){run.resources=0;activeRun=null;d.state='Completed';d.message=diagnostic?'scenarioComplete':'completedHint';if(!diagnostic&&d.revision===run.revision){d.trial=run.revision;d.reviewed=0}render()}else{run.timer=setTimeout(tick,600);render()}}run.timer=setTimeout(tick,600)}
function cancel(){if(!canCancel())return;const run=activeRun;run.cancelled=true;clearTimeout(run.timer);drafts[run.entity].message='drainHint';render();run.timer=setTimeout(()=>{if(activeRun!==run)return;run.resources=0;drafts[run.entity].state='Stale';drafts[run.entity].message='drained';drafts[run.entity].partialSteps=run.steps;activeRun=null;render()},1200)}

function recover(){if(activeRun)return;const d=m();if(d.state==='Empty'){d.state='Ready';d.message='readyHint';search='';filter='all';requestSelection('CAV-01')}else if(d.state==='RecoverableError'){d.receiptResolved=true;d.state='Completed';d.message='receiptFound';render()}else if(d.state==='Stale'||d.state==='Blocked'){if(mode!=='engineering')switchMode('engineering');else if(canEdit())openDialog('edit');else openDialog('requirements')}else openDialog('evidence')}
