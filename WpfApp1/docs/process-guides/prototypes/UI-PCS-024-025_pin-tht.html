function renderMethod(){
 const l=m().lab;
 pane.innerHTML='<div class="engineering-head"><div><div class="eyebrow">DEMO-METHOD / ENGINEERING ONLY</div><h2>'+esc(tr(mode==='insertion'?'pinLab':'thtLab'))+'</h2><p>'+esc(tr('methodOnly'))+'</p></div>'+btn('add-side','addSide')+'</div><div class="lab-pins">'+['P1','P2','P3','P4','P5','P6'].map(id=>'<button id="lab-'+id+'" class="'+(l.pin===id?'active':'')+'">'+id+'</button>').join('')+'<span>'+esc(tr('labSelected'))+' '+esc(l.pin)+'</span></div><div id="methodBody"></div>';
 for(const id of ['P1','P2','P3','P4','P5','P6'])action('lab-'+id,()=>{l.pin=id;l.shape=id==='P3'?'fork':id==='P2'?'square':'round';l.support=id==='P3'?'partial':'full';render();});
 action('add-side',()=>{const id='DEMO-SIDE-'+mode+'-'+(++m().sideClock);m().history.push({kind:'sideRecord',id,status:'UNCOMMITTED / ENGINEERING ONLY',source:id,parent:'DEMO-OBS-r7',view:'SIDE',qualification:'NOT VALIDATED',originalChanged:false});openDialog('history',{index:m().history.length-1});});
 if(mode==='insertion')renderPinLab();else renderThtLab();
}
function mappingHtml(l){
 const missing=['missing','occluded'].includes(l.map),tie=l.map==='tie';
 const edges=(missing?[['P1','C1',0],['P3','C3',.4]]:[['P1','C1',0],['P2','C2',tie?.5:.4],['P2','C3',tie?.5:.6],['P3','C2',tie?.5:.6],['P3','C3',tie?.5:.4]]).concat([['P4','C4',0],['P5','C5',0],['P6','C6',0]]);
 let out='<div class="panel"><div class="panelhead"><h2>'+esc(tr('mapLabel'))+'</h2></div><div class="body">'+selectHtml('lab-map-case','mapLabel',[['unique','uniqueMap'],['tie','tieMap'],['missing','missingMap'],['occluded','occludedMap'],['budget','budgetMap']],l.map)+'<div class="edge-list">';
 for(const e of edges)out+='<button id="edge-'+e[0]+'-'+e[1]+'" data-edge="'+e[0]+'-'+e[1]+'" class="'+(l.edge===e[0]+'-'+e[1]?'active':'')+'">'+e[0]+' → '+e[1]+' · '+e[2]+'</button>';
 out+='</div><div class="toolbar">'+btn('map-primary','assigned',false,l.witness==='primary'?'active':'')+btn('map-alternative','alternative',!tie,l.witness==='alternative'?'active':'')+'</div><p id="mapping-result" class="'+(tie||missing||l.map==='budget'?'unknown':'')+'">'+(missing?'P1→C1 · P2→'+(l.map==='missing'?tr('missingCandidate'):tr('unresolved'))+' · P3→C3':l.map==='budget'?tr('incompleteGraph'):tie?(l.witness==='primary'?'P2→C2 · P3→C3':'P2→C3 · P3→C2')+' · K=2 / C=1 / '+esc(tr('ambiguousComponent')):'P1→C1 · P2→C2 · P3→C3 · K=2 / C=0.8')+'</p><p class="muted">'+esc(tr('mappingFixed'))+' '+esc(tr('edgeOnly'))+' '+esc(l.edge)+'</p></div></div>';
 return out;
}
function bindMap(l){
 $('lab-map-case').onchange=e=>{l.map=e.target.value;l.witness='primary';render();};
 document.querySelectorAll('[data-edge]').forEach(el=>el.onclick=()=>{l.edge=el.dataset.edge;render();});
 action('map-primary',()=>{l.witness='primary';render();});action('map-alternative',()=>{if(l.map==='tie'){l.witness='alternative';render();}});
}
function renderPinLab(){
 const l=m().lab,axisOK=l.shape!=='fork'&&!['single','top','parallel','partial'].includes(l.support)&&l.datum!=='invalid',refZ=l.datum==='housing'?.4:0,z=refZ+l.h,t=z/.8,sectionOK=axisOK&&t>=0&&t<=2,H=l.datum==='invalid'||l.shape==='fork'||l.support==='partial'?null:1.6-refZ,pairOK=sectionOK&&l.map==='unique',groupOK=l.shape!=='fork'&&!['tie','budget'].includes(l.map);
 let out='<div class="lab-grid"><div class="panel"><div class="panelhead"><h2>'+esc(tr('shape'))+' · '+esc(l.pin)+'</h2><span class="badge">DEMO-PIN-AXIS-1</span></div><div class="body"><div class="formrow">'+selectHtml('lab-shape','shape',[['round','round'],['square','square'],['fork','fork']],l.shape)+selectHtml('lab-support','supportCase',[['full','full'],['single','single'],['top','topOnly'],['parallel','parallel'],['bent','bent'],['partial','partial']],l.support)+selectHtml('lab-datum','datumLabel',[['board','board'],['housing','housing'],['invalid','invalidRef']],l.datum)+'</div><label class="field"><span>'+esc(tr('section'))+' <output id="sectionPosition">'+l.h.toFixed(2)+'</output></span><input id="sectionSlider" type="range" min="0" max="2.4" step=".1" value="'+l.h+'"></label>'+pinSvg(l,sectionOK)+'<p>'+esc(tr('finiteAxis'))+' '+esc(tr('axisDatum'))+'</p><div class="metrics-grid">'+box(tr('relativeHeight'),val(H),H===null?'':'mm')+box(tr('axisLength'),val(axisOK?(1.6-refZ)/.8:null),'mm')+box(tr('angle'),axisOK?'36.870':tr('notObserved'),'°')+box('Q(h)',sectionOK?'('+(.75*z).toFixed(3)+', 0, '+z.toFixed(3)+')':tr('notObserved'),sectionOK?'mm':tr(axisOK?'outside':'sectionUnavailable'))+box('P1–P2 @ h',pairOK?Math.abs(2.54-.75*z).toFixed(3):tr('notObserved'),pairOK?'mm':tr(l.map==='missing'?'pairMissing':'pairUnknown'))+box(tr('groupRange'),groupOK?'0.070 mm':tr('notObserved'),!groupOK?tr(l.shape==='fork'?'forkIncomplete':'pairUnknown'):l.map==='missing'||l.map==='occluded'||l.support==='partial'?tr('subsetBound'):tr('fullGroup'))+'</div><p class="callout">'+esc(tr(l.shape==='fork'?'forkNote':l.support==='single'?'squareNote':l.support==='bent'?'bendNote':'normalNote'))+'</p><div class="formrow">'+btn('toggle-lift',l.lift?'liftOn':'liftOff')+'</div><p id="datum-result">DEMO-SHOULDER · BOARD: '+(l.lift?11:10)+'.000 mm · HOUSING: '+(l.lift?1:0)+'.000 mm · SELF-FIT RMS: 0</p><p class="muted">'+esc(tr('referenceNote'))+'</p></div></div>'+mappingHtml(l)+'</div>';
 $('methodBody').innerHTML=out;
 $('lab-shape').onchange=e=>{l.shape=e.target.value;l.pin=l.shape==='fork'?'P3':l.shape==='square'?'P2':'P1';if(l.shape==='fork')l.support='partial';else l.support='full';render();};
 $('lab-support').onchange=e=>{l.support=e.target.value;if(l.support==='single'){l.shape='square';l.pin='P2';}if(l.support==='partial'){l.shape='fork';l.pin='P3';}render();};
 $('lab-datum').onchange=e=>{l.datum=e.target.value;render();};
 $('sectionSlider').oninput=e=>{l.h=Number(e.target.value);$('sectionPosition').textContent=l.h.toFixed(2);};$('sectionSlider').onchange=()=>render();
 action('toggle-lift',()=>{l.lift=!l.lift;render();});bindMap(l);
}
function pinSvg(l,ok){
 const y=180-((l.datum==='housing'?.4:0)+l.h)*65,shape=l.shape==='fork'?'<path d="M220 180V110L196 75V35M220 110L254 75V35" stroke="var(--muted)" stroke-width="13" fill="none"/><text x="173" y="25" fill="var(--text)">P3/A</text><text x="258" y="25" fill="var(--warn)">P3/B ?</text>':l.shape==='square'?'<path d="M210 180L278 50L305 64L237 194Z" fill="var(--panel2)" stroke="var(--accent)" stroke-width="2"/><path d="M237 194L305 64" stroke="var(--warn)" stroke-width="5"/>':'<path d="M211 180L285 48" stroke="var(--muted)" stroke-width="18"/><path d="M211 180L285 48" stroke="var(--text)" stroke-width="2"/>';
 return '<svg class="method-svg" viewBox="0 0 520 230" aria-label="DEMO-PIN-AXIS-1"><path d="M35 184H480" stroke="var(--accent)" stroke-width="3"/><text x="35" y="211" fill="var(--text)">BOARD-D1 · z=0</text><path d="M35 154H480" stroke="var(--muted)" stroke-dasharray="3 5"/><text x="330" y="174" fill="var(--muted)">HOUSING · z=0.4</text>'+shape+'<path d="M55 '+y+'H468" stroke="'+(ok?'var(--ok)':'var(--warn)')+'" stroke-dasharray="6 5"/><text x="58" y="'+(y-7)+'" fill="var(--text)">h='+l.h.toFixed(2)+' mm</text><path d="M380 180V50" stroke="var(--muted)" stroke-width="12"/><text x="369" y="34" fill="var(--text)">P2</text>'+(l.support==='bent'?'<path d="M285 48L308 39L321 25" stroke="var(--warn)" stroke-width="8" fill="none"/>':'')+'<text x="38" y="24" fill="var(--muted)">u=(0.6,0,0.8)</text></svg>';
}
function bridgeData(l){
 const cells=l.bridge==='no'||l.bridge==='remote'||l.bridge==='closing'?['F','B','F']:l.bridge==='yes'||l.bridge==='edge'||l.bridge==='anchor'?['F','F','F']:['F','U','F'];
 const edges=l.bridge==='edge'?['K','U']:['K','K'],anchors=l.bridge==='anchor'?['U','K']:['K','K'];
 const lower=cells.every(v=>v==='F')&&edges.every(v=>v==='K')&&anchors.every(v=>v==='K'),upper=cells.every(v=>v!=='B');
 return {cells,edges,anchors,lower,upper,result:lower?'knownPath':upper?'possiblePath':'cutPath'};
}
function renderThtLab(){
 const l=m().lab,d=bridgeData(l),tip=l.tip==='hidden'?null:1.5,contact=l.tip==='contact'?null:1,bare=tip!==null&&contact!==null?.5:null;
 let out='<div class="lab-grid"><div class="panel"><div class="panelhead"><h2>'+esc(tr('thtLab'))+'</h2><span class="badge">W23 / P2–P3 / DEMO</span></div><div class="body"><div class="formrow">'+selectHtml('lab-bridge-case','bridgeFixture',[['unknown','unknownBridge'],['no','noBridge'],['yes','yesBridge'],['edge','spaceUnknown'],['remote','remote'],['closing','closing'],['anchor','anchorUnknown']],l.bridge)+selectHtml('lab-permit','permit',[['forbidden','forbidden'],['allowed','allow'],['pending','pendingRule']],l.permit)+'</div><div class="toolbar">'+btn('support-lower','lower',false,l.layer==='lower'?'active':'')+btn('support-upper','upper',false,l.layer==='upper'?'active':'')+'</div>'+bridgeSvg(l,d)+'<p class="muted">'+esc(tr('knownF'))+' · '+esc(tr('knownB'))+' · '+esc(tr('unknownU'))+'<br>'+esc(tr('edgeLegend'))+'</p><p id="bridge-result" class="'+(d.lower?'good':'unknown')+'">'+esc(tr(d.result))+'</p><div class="metrics-grid">'+box('D / F / B / U','3 / '+d.cells.filter(x=>x==='F').length+' / '+d.cells.filter(x=>x==='B').length+' / '+d.cells.filter(x=>x==='U').length,tr('fixedCells'))+box('F/D … (F+U)/D',d.cells[1]==='U'?'[2/3, 1]':d.cells[1]==='B'?'[2/3, 2/3]':'[1, 1]',tr('discreteCoverage'))+'</div><p>'+esc(tr('localOnly'))+'</p><p class="callout">'+esc(tr(l.permit==='pending'?'pendingRule':l.permit==='allowed'?'allowedNote':d.lower?'violation':d.result))+'</p><p class="muted">'+esc(tr('qualification'))+'</p></div></div><div class="panel"><div class="panelhead"><h2>'+esc(tr('tipCaseLabel'))+'</h2><span class="badge">DEMO-TIP-1</span></div><div class="body">'+selectHtml('lab-tip-case','tipCaseLabel',[['visible','tipVisible'],['hidden','tipHidden'],['contact','contactHidden']],l.tip)+'<svg class="method-svg" viewBox="0 0 360 230" aria-label="DEMO-TIP-1"><path d="M25 202H330" stroke="var(--accent)" stroke-width="3"/><path d="M145 200V95" stroke="var(--muted)" stroke-width="16"'+(tip===null?' stroke-dasharray="5 6"':'')+'/><path d="M90 200Q100 160 145 130Q220 48 255 63Q286 90 305 200" fill="var(--panel2)" stroke="var(--warn)" stroke-width="3"/>'+(tip===null?'':'<circle data-tip-marker cx="145" cy="95" r="6" fill="var(--ok)"/>')+(contact===null?'':'<circle data-contact-marker cx="145" cy="130" r="5" fill="var(--accent)"/>')+'<text x="27" y="220" fill="var(--text)">BOARD-D1</text><text x="26" y="88" fill="var(--text)">T · '+val(tip)+'</text><text x="220" y="40" fill="var(--text)">S · 2.000</text><text x="30" y="149" fill="var(--text)">C · '+val(contact)+'</text></svg>'+((contact===null||tip===null)?'<p class="unknown" id="estimated-point-note">'+esc(tr('estimatedPoint'))+'</p>':'')+'<div class="metrics-grid">'+box(tr('height'),val(tip),'mm')+box(tr('peak'),'2.000','mm')+box(tr('contact'),val(contact),'mm')+box(tr('bare'),val(bare),'mm')+'</div><p>'+esc(tr('peakNote'))+'</p></div></div></div>';
 $('methodBody').innerHTML=out;
 $('lab-bridge-case').onchange=e=>{l.bridge=e.target.value;render();};$('lab-permit').onchange=e=>{l.permit=e.target.value;render();};$('lab-tip-case').onchange=e=>{l.tip=e.target.value;render();};
 action('support-lower',()=>{l.layer='lower';render();});action('support-upper',()=>{l.layer='upper';render();});
}
function bridgeSvg(l,d){
 const isUpper=l.layer==='upper',xs=[100,255,410];
 let s='<svg class="method-svg" viewBox="0 0 520 230" aria-label="DEMO-W23"><rect x="38" y="42" width="438" height="125" rx="14" fill="none" stroke="var(--accent)" stroke-dasharray="5 4"/><text x="40" y="28" fill="var(--text)">W23 · A2 / M / A3</text>';
 for(let i=0;i<2;i++){
  const active=isUpper?(d.cells[i]!=='B'&&d.cells[i+1]!=='B'):(d.cells[i]==='F'&&d.cells[i+1]==='F'&&d.edges[i]==='K');
  s+='<path d="M'+(xs[i]+29)+' 105H'+(xs[i+1]-29)+'" stroke="'+(active?'var(--ok)':'var(--line)')+'" stroke-width="7"'+(d.edges[i]==='U'?' stroke-dasharray="6 7"':'')+'/><text x="'+(xs[i]+60)+'" y="86" fill="var(--muted)">'+d.edges[i]+'</text>';
 }
 d.cells.forEach((v,i)=>s+='<circle cx="'+xs[i]+'" cy="105" r="29" fill="var(--panel2)" stroke="'+(v==='F'?'var(--ok)':v==='B'?'var(--bad)':'var(--warn)')+'" stroke-width="3"/><text x="'+xs[i]+'" y="112" text-anchor="middle" fill="var(--text)" font-size="22">'+v+'</text><text x="'+xs[i]+'" y="149" text-anchor="middle" fill="var(--muted)">'+['A2','M','A3'][i]+'</text>');
 if(l.bridge==='remote')s+='<path d="M100 170V204H410V170" fill="none" stroke="var(--warn)" stroke-dasharray="5 6"/><text x="190" y="224" fill="var(--warn)">'+esc(tr('outsideDomain'))+' W23</text>';
 if(l.bridge==='closing')s+='<text x="160" y="202" fill="var(--warn)">'+esc(tr('addedMiddle'))+'</text>';
 if(l.bridge==='anchor')s+='<text x="40" y="200" fill="var(--warn)">'+esc(tr('anchorContact'))+'</text>';
 return s+'</svg>';
}
$('mode').onchange=e=>{const dest=e.target.value;$('mode').value=mode;navigate(tab,dest);};
$('role').onchange=e=>{const next=e.target.value;if(m().run)cancelRun();role=next;notice=role==='operator'?'readOnly':'safe';render();};
$('scenario').onchange=e=>{const next=e.target.value;if(m().run)cancelRun();scenario=next;selected=scenario==='missing'?'P2':scenario==='unknown'?'P3':scenario==='bridge'?'P2':'P1';state='Ready';render();};
$('state').onchange=e=>{const next=e.target.value;if(m().run)cancelRun();state=next;render();};
$('draft').onclick=()=>{if(writable())openDialog('edit');};
$('trial').onclick=runTrial;$('cancel').onclick=cancelRun;
$('lang').onchange=e=>{lang=e.target.value;render();};
window.prototypeSnapshot=()=>clone({prototypeVersion:'0.2.1-prep',process:mode,tab,role,lang,state,selected,mirrored,model:m(),production:{insertion:models.insertion.history[0],tht:models.tht.history[0]},dialog:dialogModel});
render();
})();

</script>
