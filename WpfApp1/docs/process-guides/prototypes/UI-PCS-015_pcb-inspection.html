function resetExtensions(){flow={step:0,draftCounter:7,source:'cam',done:Array(8).fill(false),manual:'M07',patch:false,old:null,trial:null,saved:null,cancel:false,generation:(flow?.generation??0)+1};join={epoch:'e1',late:false,revoked:false,commit:'none',unionRevoked:false};warp={quantity:'raw',support:'free',missing:false}}

function pairMarkup(pairs){return pairs.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}
function mayProgram(){return model.role==='engineer'&&!['empty','busy','denied','error','blocked'].includes(model.state)}

const flowActionKey=()=>['confirmStep','confirmStep','confirmStep','previewDiff','confirmStep','runFrozen','reviewTrial','saveDraftNew'][flow.step];

 if(flow.step===0)body+=`<label>${t('sourceLabel')} <select id="flow-source" ${mayProgram()?'':'disabled'}><option value="cam" ${flow.source==='cam'?'selected':''}>${t('sourceCam')}</option><option value="golden" ${flow.source==='golden'?'selected':''}>${t('sourceGolden')}</option></select></label><p class="fixture-line">${flow.source==='cam'?'CAM-DEMO-R3 / Board-A+B / mm / M07 / C12':t('goldenReason')}</p>`;
 if(flow.step===1||flow.step===4)body+=`<dl class="definition">${pairMarkup([[t('originalD'),'8 / 2 / 6'],[t('planned'),'6 / 6'],[t('observed'),model.mode==='mask'?'4 / 6 · 4 / 6 · 4 / 6':'5 / 6 · 5 / 6 · 5 / 6']])}</dl>`;
 if(flow.step===2||flow.step===3||flow.step===6)body+=`<p class="mono">SM-041 · TXT-012 · SUR-008 · BR-017 · OP-025 · FID-02</p><p id="manualRetention">${t('manualChoice')}: ${t('manualRetained')}</p>`;
 body+=`<dl class="definition">${pairMarkup([[t('currentDraft'),model.draftRevision??'—'],[t('oldResult'),flow.old??model.resultRevision],[t('newResult'),flow.trial?flow.trial.revision+' / '+flow.trial.source+' / '+flow.trial.attempt:t('noTrial')],[t('savedDraft'),flow.saved??t('notSaved')]])}</dl>`;

 $('flowDetail').innerHTML=body;$('flow-action').onclick=performFlowAction;
 if($('flow-source'))$('flow-source').onchange=e=>{if(!mayProgram())return;flow.source=e.target.value;flow.done.fill(false);flow.trial=null;flow.saved=null;flow.patch=false;flow.generation++;model.draftRevision=null;model.trialValidated=false;setState('stale')};

  if(model.state==='busy'&&flow.running){$('primary').textContent=t(flow.cancel?'cancelPending':'cancel');$('primary').disabled=flow.cancel}

 }
 if(model.state==='busy'&&flow.running){$('primary').textContent=t(flow.cancel?'cancelPending':'cancel');$('primary').disabled=flow.cancel;}if(focus?.startsWith('flow-'))$(focus)?.focus({preventScroll:true});
}
function nextDraftRevision(){return 'r'+(Math.max(flow.draftCounter,Number(model.resultRevision.slice(1)),Number(model.draftRevision?.slice(1)??0))+1)}

 if(!canFlowAction())return;

 if(!canFlowAction()||flow.step!==5)return;

}
