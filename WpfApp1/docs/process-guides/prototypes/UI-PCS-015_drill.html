on is unconfirmed. The fixture grants read access explicitly; cached permissions do not enable writes.'],unsaved:['结果未保存','結果未儲存','Result not saved'],saved:['结果已保存 · 非质量放行','結果已儲存 · 非品質放行','Result saved · no quality release'],savedDraft:['草稿已保存','草稿已儲存','Draft saved'],notSavedDraft:['草稿未保存','草稿未儲存','Draft not saved'],saveNote:['样例故意丢失保存响应。查询同一提交标识；不要重算或创建新提交。','範例刻意遺失儲存回應。查詢同一提交識別；不要重算或建立新提交。','The fixture drops the save response. Query the same commit identity; do not rerun or create another commit.'],loading:['正在载入同源证据…','正在載入同源證據…','Loading source-bound evidence…'],evidenceTitle:['原证据 · 合成快照','原證據 · 合成快照','Source evidence · synthetic snapshot'],evidenceNote:['此窗口展示固定证据记录，没有文件下载或真实相机图。原/拟合/残差分类分别保留。','此視窗展示固定證據記錄，沒有檔案下載或真實相機影像。原始/擬合/殘差分類分別保留。','This window shows a fixed evidence record. It contains no download or real camera image. Observed, fitted and residual classifications remain distinct.'],late:['已拒绝迟到回调','已拒絕遲到回呼','Late callbacks rejected'],best:['最佳候选见证','最佳候選見證','Best candidate witness'],alternative:['替代见证','替代見證','Alternative witness'],fullGraph:['完整输入图 · 2目标 / 2观察 / 4条边','完整輸入圖 · 2目標 / 2觀察 / 4條邊','Complete input graph · 2 targets / 2 observations / 4 edges'],partialGraph:['输入图未完整 · 2目标 / 2观察 / 3条已知边','輸入圖未完整 · 2目標 / 2觀察 / 3條已知邊','Incomplete input graph · 2 targets / 2 observations / 3 known edges'],witnessNote:['K=2、C=2来自固定样例。见证仅用于调查，两种映射都不是最终绑定。','K=2、C=2來自固定範例。見證僅供調查，兩種映射均非最終綁定。','K=2 and C=2 are fixed fixture values. Both mappings are investigation witnesses, not final bindings.'],edge:['允许边','允許邊','Allowed edge'],cost:['费用（样例单位）','費用（範例單位）','Cost (fixture unit)'],geometryRef:['几何引用','幾何引用','Geometry reference'],singleGraph:['该对象不属于C2竞争分量。选择H03或H04查看完整关系。','此物件不屬於C2競爭分量。選擇H03或H04檢視完整關係。','This object is outside component C2. Select H03 or H04 to inspect its relationships.'],showC2:['定位 H03 / C2','定位 H03 / C2','Locate H03 / C2'],binding:['最终绑定','最終綁定','Final binding'],none:['无','無','None'],step0:['来源','來源','Source'],step1:['检测意图','檢測意圖','Inspection in ion. No suggestion is auto-accepted and no issue is deleted.'],step7Note:['保存草稿、保存工程结果、批准、发布、激活分别处理。本样例尚有未决，发布不可用；保存不代表可生产。','儲存草稿、儲存工程結果、核准、發布、啟用分別處理。本範例仍有未決，無法發布；儲存不代表可生產。','Draft save, trial save, approval, release and activation are separate. Unresolved fixture requirements block release. Saving does not authorize production.'],cam:['制造资料 CAM-DEMO / R3','製造資料 CAM-DEMO / R3','Manufacturing data CAM-DEMO / R3'],golden:['金板样图 GOLDEN-DEMO / G1','金板樣圖 GOLDEN-DEMO / G1','Golden-board image GOLDEN-DEMO / G1'],sourceCheck:['核对并载入来源','核對並載入來源','Check & load source'],intentCheck:['使用样例检测意图','使用範例檢測意圖','Use fixture inspection intent'],generate:['载入草稿目标','載入草稿目標','Load draft targets'],preview:['预览草稿差异','預覽草稿差異','Preview draft changes'],coverageCheck:['查看覆盖并继续工程试算','檢視覆蓋並繼續工程試算','Review coverage & continue trial'],continue:['继续下一步','繼續下一步','Continue'],reviewChanges:['记录工程审阅','記錄工程審閱','Record engineering review'],saveDraft:['保存草稿样例','儲存草稿範例','Save draft fixture'],publish:['发布程序','發布程式','Release program'],publishBlocked:['未决：C2关联、H06观察和域E缺口。处理缺项后须重新验证，不能手工勾选通过。','未決：C2關聯、H06觀察與域E缺口。處理缺項後須重新驗證，不能手動勾選通過。','Unresolved: C2 association, H06 observations and domain E coverage. Resolve the gaps and validate again. A manual override cannot clear them.'],goldenBlocked:['金板没有设计目标全集，无法证明参考本身缺孔。请选择制造资料继续本完整性场景。','金板沒有設計目標全集，無法證明參考本身缺孔。請選擇製造資料繼續此完整性情境。','The golden board lacks the design target universe and cannot reveal holes missing from the reference. Use manufacturing data for this completeness fixture.'],draftPreview:['仅作用于H01、H02；与r7原结果分离。应用后须重新核覆盖并试算。','僅作用於H01、H02；與r7原結果分離。套用後須重新核對覆蓋並試算。','Applies only to H01/H02, separately from the r7 result. Coverage review and a new trial are required after applying.'],reviewRecord:['工程审阅已记录；质量与发布状态未变。','已記錄工程審閱；品質與發布狀態未變。','Engineering review recorded. Quality and release status are unchanged.'],loaded:['已核对','已核對','Checked'],next:['待进行','待進行','Pending'],frozenInput:['固定输入','固定輸入','Frozen input'],sampleOnly:['样例参数 · 非产品默认值','範例參數 · 非產品預設值','Fi h();};$('alternative').onclick=()=>{s.witness='alternative';renderGraph();};}
function renderStatus(){let key=s.fixture==='empty'?'emptyState':s.fixture==='wrong'?'blocked':s.fixture==='auth'?'authUnknown':s.busy?'busy':s.draining?'draining':s.receipt==='unknown'?'unknown':s.role==='reader'?'readOnly':s.draft!==s.resultRev?'stale':s.completed?'completed':'ready';$('state').textContent=t(key);$('state').dataset.state=key;$('statusDetail').textContent=s.fixture==='wrong'?t('wrongReason'):s.fixture==='auth'?t('authReason'):s.fixture==='empty'?t('noInput'):s.busy?`${t('busy')} · ${s.phase}/3 · r${s.draft}`:s.draining?t('cancelled'):t('qualityStatus');$('receipt').textContent=[s.receipt==='none'?t('unsaved'):s.receipt==='unknown'?`${s.commit} · ${t('saveNote')}`:`${s.commit} · ${t('saved')}`,`${t('late')}: ${s.late+s.evidenceLate}`].join(' | ');$('run').disabled=!canRun();$('saveResult').disabled=!canWrite()||s.fixture==='empty'||s.busy||s.draining||s.receipt!=='none';$('query').hidden=s.receipt!=='unknown';$('query').disabled=!canRead();$('cancel').hidden=!s.busy;$('cancel').disabled=!canWrite();$('refresh').disabled=s.fixture==='empty';}
function renderProgram(){$('steps').innerHTML=Array.from({length:8},(_,i)=>`<button id="step-${i}" class="${s.step===i?'active':''}" ${i>s.reached?'disabled':''}><b>P${i}</b><span>${t('step'+i)}</span><small>${i<s.reached?'✓':''}</small></button>`).join('');for(let i=0;i<8;i++)$('step-'+i).onclick=()=>{s.step=i;renderProgram();};let content='',action='',disabled=!canWrite()||s.busy||s.draining;if(s.step===0){content=`<span class="label">${t('frozenInput')}</span><select id="source"><option value="cam">${t('cam')}</option><option value="golden">${t('golden')}</option></select><dl class="details"><dt>${t('sourceRevision')}</dt><dd>R3 / G1</dd><dt>${t('frameUnitSide')}</dt><dd>B · mm · A</dd></dl>${s.source==='golden'?`<div class="reason">${t('goldenBlocked')}</div>`:''}`;action=`<button id="sourceCheck" class="primary" ${disabled?'disabled':''}>${t('sourceCheck')}</button>`;}else if(s.step===1){content=`<div class="chips">${['presence','size','position','morphology'].map(k=>`<span class="badge">${t(k)}</span>`).join('')}</div><p class="panelnote">${t('sampleOnly')}</p>`;action=`<button id="intentCheck" class="primary" ${disabled?'disabled':''}>${t('intentCheck')}</button>`;}else if(s.step===2){content=`<div class="trace">H01 · H02 · H03 · H04 · H05 · H06\nM-DRILL-4 · G3\n${t('manualOverride')}</div>`;action=`<button id="generate" class="primary" ${disabled?'disabled':''}>${t('generate')}</button>`;}else if(s.step===3){content=`<div class="trace">H01 / H02\n${t('searchGate')}: 0.20 → 0.25 mm\n${t('toleranceUnchanged')}\n${t('qualificationUnchanged')}</div>`;action=`<button id="preview" class="primary" ${disabled?'disabled':''}>${t('preview')}</button>${s.changed?`<button id="advance">${t('continue')}</button>`:''}`;}else if(s.step===4){content=`<div class="trace">${t('requiredLabel')}: 6\nC2: ${t('ambiguous')}\nH06: ${t('invalidObservation')}\nE: 88%</div>`;action=`<button id="coverageCheck" class="primary" ${disabled?'disabled':''}>${t('coverageCheck')}</button>`;}else if(s.step===5){content=`<div class="trace">B42 / A · S3 · r${s.draft}\n${s.result}\n${s.previous?`${t('savedResultOld')}: ${s.previous}`:''}</div>`;action=`<button id="trialStep" class="primary" ${canRun()?'':'disabled'}>${t('run')}</button>${s.completed&&s.resultRev===s.draft?`<button id="advance">${t('continue')}</button>`:''}`;}else if(s.step===6){content=`<div class="trace">r7 → r${s.draft}\nH01 / H02: 0.20 → 0.25 mm\n${t('targetChanges')}: +0 / −0\n${t('manualOverride')}\n${t('qualityStatus')}</div>`;action=`<button id="reviewChanges" class="primary" ${disabled?'disabled':''}>${t('reviewChanges')}</button>`;}else{content=`<div class="reason">${t('publishBlocked')}</div><div class="trace">${t('draftWord')} r${s.draft}: ${t(s.draftSaved?'savedDraft':'notSavedDraft')}\n${s.result}\n${t('qualityStatus')}</div>`;action=`<button id="saveDraft" class="primary" ${disabled||s.draftSaved?'disabled':''}>${t('saveDraft')}</button><button id="publish" disabled>${t('publish')}</button>`;}$('stepcontent').innerHTML=`<span class="label mono">P${s.step} / P7 · ${t('engineeringOnly')}</span><h2>${t('step'+s.step)}</h2><p>${t('step'+s.step+'Note')}</p><div class="step-content-box">${content}</div><div class="stepactions">${action}</div>`;if($('source')){$('source').value=s.source;$('source').disabled=disabled;$('source').onchange=e=>{s.source=e.target.value;s.sourceChecked=false;s.reached=0;s.changed=false;s.completed=false;s.reviewed=false;s.draftSaved=false;s.draft++;render();};}if($('sourceCheck'))$('sourceCheck').onclick=()=>{if(!canWrite())return;if(s.source==='golden'){toast('goldenBlocked');return;}s.sourceChecked=true;advance(1);};if($('intentCheck'))$('intentCheck').onclick=()=>advance(2);if($('generate'))$('generate').onclick=()=>{if(!canWrite())return;s.draft++;s.draftSaved=false;s.changed=false;s.completed=false;s.reviewed=false;s.reached=3;advance(3);render();};if($('preview'))$('preview').onclick=()=>openDialog('preview','draftPreview','H01 / H02\n0.20 → 0.25 mm\nr'+s.draft+' → r'+(s.changed?s.draft:s.draft+1),()=>{if(!canWrite()||s.busy||s.draining)return;if(!s.changed)s.draft++;s.changed=true;s.completed=false;s.draftSaved=false;s.reached=3;render();});if($('coverageCheck'))$('coverageCheck').onclick=()=>advance(5);if($('trialStep'))$('trialStep').onclick=runTrial;if($('advance'))$('advance').onclick=()=>advance(s.step+1);if($('reviewChanges'))$('reviewChanges').onclick=()=>{if(!canWrite())return;s.reviewed=true;advance(7);toast('reviewRecord');};if($('saveDraft'))$('saveDraft').onclick=()=>{if(!canWrite()||s.busy)return;s.draftSaved=true;render();toast('savedDraft');};}
function advance(n){if(!canWrite()||s.busy||s.draining)return;s.step=n;s.reached=Math.max(s.reached,n);renderProgram();}
function toast(key){toastKey=key;clearTimeout(toastTimer);$('toast').textContent=t(key);$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,4000);}
function renderDialog(){if(!dialogModel)return;$('dialogTitle').textContent=t(dialogModel.title);$('dialogText').textContent=t(dialogModel.desc);$('trace').textContent=typeof dialogModel.trace==='function'?dialogModel.trace():dialogModel.trace;$('confirm').hidden=!dialogAction;$('confirm').textContent=t('apply');}
function openDialog(title,desc,trace,action=null){dialogTrigger=document.activeElement;dialogTriggerId=dialogTrigger?.id||'';dialogEpoch++;dialogAction=action;dialogModel={title,desc,trace};$('dialog').dataset.request=String(dialogEpoch);renderDialog();if(!$('dialog').open)$('dialog').showModal();$('dismiss').focus();}
function closeDialog(){dialogEpoch++;$('dialog').close();dialogAction=null;dialogModel=null;const trigger=dialogTrigger?.isConnected?dialogTrigger:$(dialogTriggerId);trigger?.focus();}
function openEvidence(){const o=targets.find(o=>o.id===s.selected);if(!o||!canRead())return;const key=o.id,gen=viewEpoch,runEpoch=epoch,result=s.result;openDialog('evidenceTitle','evidenceNote',()=>t('loading'));const dlg=dialogEpoch;setTimeout(()=>{if(runEpoch!==epoch)return;if(gen!==viewEpoch||key!==s.selected||dlg!==dialogEpoch||!$('dialog').open){s.evidenceLate++;renderStatus();return;}dialogModel.trace=()=>`DRILL-DEMO · B42 / A\n${result}\nSource S3 · ${o.obs} · G3\nTarget ${key} · view ${gen}\nT-17 · M-DRILL-4\n${t('raw')} / ${t('fit')} / ${t('excluded')}\n${t('synthetic')}`;renderDialog();},420);}
function runTrial(){if(!canRun())return;const token=++epoch,rev=s.draft,owned=s;viewEpoch++;s.busy=true;s.draining=false;s.phase=0;s.completed=false;s.notice='';const oldResult=s.result;render();for(let i=1;i<=3;i++)setTimeout(()=>{if(s!==owned)return;if(token!==epoch){if(i===3){s.late++;s.draining=false;render();toast('cancelDone');}return;}s.phase=i;if(i===3){s.busy=false;s.completed=true;s.previous=oldResult;s.trial++;s.resultRev=rev;s.result=`ER-B42-T${s.trial}-r${rev}`;s.commit='';s.receipt='none';viewEpoch++;render();}else{renderStatus();}},i*450);}
$('run').onclick=runTrial;$('cancel').onclick=()=>{if(!s.busy||!canWrite())return;epoch++;s.busy=false;s.draining=true;render();};$('saveResult').onclick=()=>{if(!canWrite()||s.busy||s.draining||s.fixture==='empty'||s.receipt!=='none')return;s.commit=`COMMIT-${s.result}`;s.receipt='unknown';render();};$('query').onclick=()=>{if(!canRead()||!s.commit||s.receipt!=='unknown')return;s.receipt='saved';render();};$('refresh').onclick=()=>{renderStatus();toast('refreshed');};$('close').onclick=closeDialog;$('dismiss').onclick=closeDialog;$('dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog();});$('confirm').onclick=()=>{const action=dialogAction;closeDialog();action?.();};$('fixture').onchange=seed;$('role').onchange=()=>{s.role=$('role').value;render();};$('language').onchange=()=>{const focus=document.activeElement;lang=$('language').value;render();if($('dialog').open&&$('dialog').contains(focus))focus.focus();};$('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};$('inspectionTab').onclick=()=>{s.tab='inspect';render();};$('programTab').onclick=()=>{s.tab='program';render();};$('imageTab').onclick=()=>{s.visual='image';renderMain();};$('graphTab').onclick=()=>{s.visual='graph';renderMain();};$('search').oninput=$('filter').onchange=()=>{viewEpoch++;renderMain();};document.querySelectorAll('[data-layer]').forEach(e=>e.onclick=()=>{s.layers[e.dataset.layer]=!s.layers[e.dataset.layer];renderBoard();});document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='f'&&!$('dialog').open){e.preventDefault();s.tab='inspect';render();$('search').focus();}});
Object.defineProperty(window,'reviewSnapshot',{get:()=>JSON.parse(JSON.stringify(s))});seed();
</script></body></html>
