  h+=`<label>${t('dotGraph')}<select id="lab-graph"><option value="unique" ${lab.graph==='unique'?'selected':''}>${t('graphUnique')}</option><option value="tie" ${lab.graph==='tie'?'selected':''}>${t('graphTie')}</option></select></label><svg class="method-svg" viewBox="0 0 520 180" role="img" aria-label="${esc(t('dotGraph'))}">${edges.map(([a,b],i)=>`<line x1="95" y1="${i<2?45:135}" x2="425" y2="${i%2?135:45}" stroke="${i===lab.edge?'var(--warn)':'var(--line)'}" stroke-width="${i===lab.edge?4:2}"/>`).join('')}${[['T-A',65,45],['T-B',65,135],['B-1',445,45],['B-2',445,135]].map(([id,x,y])=>`<circle cx="${x}" cy="${y}" r="26" fill="var(--raised)" stroke="var(--accent)"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="var(--text)" font-size="12">${id}</text>`).join('')}</svg><div class="row">${edges.map(([a,b],i)=>`<button id="edge-${i}" aria-pressed="${lab.edge===i}">${a} → ${b} / ${costs[i]}</button>`).join('')}</div><p>${t('mainSolution')}: T-A→B-1, T-B→B-2 / ${costs[0]+costs[3]}<br>${t('alternative')}: T-A→B-2, T-B→B-1 / ${costs[1]+costs[2]}</p><div class="notice">${t('selectedEvidence')}: ${edges[lab.edge].join(' → ')}<p class="mono">TARGET-${edges[lab.edge][0]} / OBS-${edges[lab.edge][1]} · ${t('cost')}: ${costs[lab.edge]}</p></div><p>${t('numericOnly')}</p>`;
 }else if(lab.tab==='section'){
  h+=`<label>${t('section')}<select id="lab-section-case">${[['normal','sectionNormal'],['missing','sectionMissing'],['touch','sectionTouch']].map(([v,k])=>`<option value="${v}" ${lab.section===v?'selected':''}>${t(k)}</option>`).join('')}</select></label><svg class="method-svg" viewBox="0 0 520 100" role="img" aria-label="${esc(t('allSections'))}"><line x1="30" y1="50" x2="490" y2="50" stroke="var(--line)"/><path d="M200 18V82" stroke="var(--warn)" stroke-dasharray="4 3"/>${lab.section==='normal'?'<rect x="149" y="38" width="102" height="24" fill="var(--accent)"/><rect x="320" y="38" width="40" height="24" fill="var(--good)"/><rect x="380" y="38" width="30" height="24" fill="var(--warn)"/>':lab.section==='touch'?'<rect x="200" y="38" width="30" height="24" fill="var(--accent)"/>':'<rect x="30" y="38" width="460" height="24" fill="var(--warn)" opacity=".4"/>'}<text x="200" y="95" fill="var(--text)" text-anchor="middle">u=0</text></svg><table class="diff-table"><thead><tr><th>${t('segment')}</th><th>${t('method')}</th></tr></thead><tbody>${lab.section==='normal'?`<tr><td>[-0.51, 0.51] mm</td><td>${t('selectedSegment')} / 1.02mm</td></tr><tr><td>[1.20, 1.60] mm</td><td>${t('otherSegment')} / 0.40mm</td></tr><tr><td>[1.80, 2.10] mm</td><td>${t('unknown')}</td></tr>`:`<tr><td>${lab.section==='touch'?'[0, 0.30] mm':'[-1.70, 2.90] mm'}</td><td>${t('noWidth')}</td></tr>`}</tbody></table><p>${t('sectionRule')}</p>`;
 }else if(lab.tab==='node'){
  const connected=lab.node==='yes'||lab.node==='unknown'&&lab.support==='upper';
  h+=`<label>${t('relation')}<select id="lab-node-case">${[['unknown','nodeUnknown'],['yes','nodeYes'],['no','nodeNo']].map(([v,k])=>`<option value="${v}" ${lab.node===v?'selected':''}>${t(k)}</option>`).join('')}</select></label><div class="row">${['lower','upper'].map(k=>`<button id="support-${k}" aria-pressed="${lab.support===k}">${t(k)}</button>`).join('')}</div><svg class="method-svg" viewBox="0 0 520 180" role="img" aria-label="${esc(t('nodeGraph'))}"><rect x="50" y="28" width="420" height="125" rx="12" fill="var(--raised)" stroke="var(--accent)"/><text x="62" y="48" fill="var(--text)">W</text><path d="M100 110H260V65" fill="none" stroke="var(--accent)" stroke-width="8"/>${connected?`<path d="M260 110H420" stroke="${lab.node==='unknown'?'var(--warn)':'var(--accent)'}" stroke-width="8" ${lab.node==='unknown'?'stroke-dasharray="8 4"':''}/>`:''}<path d="M100 110V165H420V110" fill="none" stroke="var(--muted)" stroke-dasharray="3 4"/>${[['A',100,110],['B',260,65],['C',420,110]].map(([id,x,y])=>`<rect x="${x-15}" y="${y-15}" width="30" height="30" fill="var(--panel)" stroke="var(--warn)"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="var(--text)">${id}</text>`).join('')}</svg><p id="node-witness">${t(lab.node==='yes'?'nodeYes':lab.node==='no'?'nodeNo':'nodeUnknown')}</p><p class="mono">${t('witness')}: ${connected?'[A,B,C]':'[A,B] / [C]'}</p><p class="small">${t('nodeLocal')}</p>`;
 }else if(lab.tab==='fusion'){
  h+=`<h3>${t('conflictBoth')}</h3><div class="row">${['A','B','C'].map(v=>`<button id="fusion-${v}" aria-pressed="${lab.fusionView===v}">${v} · ${t(v==='B'?'uncoated':'coated')}</button>`).join('')}<label><input id="hide-view-b" type="checkbox" ${lab.hideB?'checked':''}> B / ${t('viewHidden')}</label></div><div class="fusion-views">${['A','B','C'].filter(v=>!lab.hideB||v!=='B').map(v=>`<div class="fusion-patch ${v==='B'?'negative':''}"><b>${v}</b><span>${t(v==='B'?'uncoated':'coated')}</span><small>DEMO-VIEW-${v} / PATCH-P01</small></div>`).join('')}</div><p id="fusion-result">${t('fusionExplain')}</p><div class="notice"><b>${t('selectedEvidence')} / ${lab.fusionView}</b><p class="mono">DEMO-VIEW-${lab.fusionView} / PATCH-P01 / 1mm² / ${lab.fusionView==='B'?'N':'M'}</p></div><h3>${t('denominator')}</h3><table class="diff-table"><thead><tr><th>${t('wholeDomain')}</th><th>M / N / U (mm²)</th><th>${t('observedDomain')}</th></tr></thead><tbody><tr><td>C = 100mm²</td><td>76 / 4 / 20</td><td>76/80 = 95% · 80/100 = 80%</td></tr><tr><td>K = 10mm²</td><td>0.2 / 7.8 / 2</td><td>2% – 22%</td></tr></tbody></table><p class="small">${t('boundNote')} · ${t('sideHint')}</p>`;
 }else{
  const rays=[{id:'R1',area:1,lower:[0],upper:0.01},{id:'R2',area:3,lower:[0],upper:0.03},{id:'R3',area:1,lower:[0,0.02],upper:0.04}],r=rays[lab.ray];
  h+=`<div class="row">${rays.map((r,i)=>`<button id="ray-${i}" aria-pressed="${lab.ray===i}">${r.id} / ${r.area}mm²</button>`).join('')}</div><svg class="method-svg" viewBox="0 0 520 160" role="img" aria-label="${esc(t('interfaces'))}"><path d="M260 12V147" stroke="var(--muted)" stroke-dasharray="4 3"/><path d="M100 45H420" stroke="var(--accent)" stroke-width="3"/><path d="M100 120H420" stroke="var(--good)" stroke-width="3"/>${lab.ray===2?'<path d="M100 90H420" stroke="var(--warn)" stroke-width="3"/>':''}<circle cx="260" cy="45" r="6" fill="var(--accent)"/><circle cx="260" cy="120" r="6" fill="var(--good)"/>${lab.ray===2?'<circle cx="260" cy="90" r="6" fill="var(--warn)"/>':''}<text x="110" y="35" fill="var(--text)">z=${r.upper}mm</text><text x="110" y="140" fill="var(--text)">z=0mm</text>${lab.ray===2?'<text x="110" y="82" fill="var(--warn)">z=0.02mm</text>':''}</svg><div class="notice"><b>${r.id} / ${t('thickness')}: ${lab.ray===2?'—':r.upper+'mm'}</b><p>${t(lab.ray===2?'multiPair':'validPair')}</p><p class="mono">DEMO-LAYER-TOP / DEMO-LAYER-BASE / ${r.id}</p></div><p><b>${t('weighted')}: (1×0.01 + 3×0.03)/4 = 0.025mm</b></p><p>${t('thicknessScope')}</p>`;
 }
 $('labBody').innerHTML=h;
 const change=(id,key)=>{if($(id))$(id).onchange=e=>{lab[key]=e.target.value;render()}};change('lab-graph','graph');change('lab-section-case','section');change('lab-node-case','node');
 for(let i=0;i<4;i++)if($('edge-'+i))$('edge-'+i).onclick=()=>{lab.edge=i;render()};for(const key of ['lower','upper'])if($('support-'+key))$('support-'+key).onclick=()=>{lab.support=key;render()};
 for(const key of ['A','B','C'])if($('fusion-'+key))$('fusion-'+key).onclick=()=>{lab.fusionView=key;render()};if($('hide-view-b'))$('hide-view-b').onchange=e=>{lab.hideB=e.target.checked;render()};for(let i=0;i<3;i++)if($('ray-'+i))$('ray-'+i).onclick=()=>{lab.ray=i;render()};
}
function openHistory(){historyDocument={process,records:structuredClone(m().history),selected:0};openDialog('history')}
function renderDialog(){
 if(dialogKind!=='history'){renderDialogBase();if(dialogKind==='leave'){$('discardDialog').disabled=!writable();$('dialogBody').insertAdjacentHTML('beforeend',`<button id="keepDraftDialog">${t('keepDraftLeave')}</button>`);$('keepDraftDialog').onclick=()=>{const a=leaveAction;leaveAction=null;closeDialog();a?.();render()}}if(dialogKind==='diff'){$('dialogBody').innerHTML=`<p>${t('diffHelp')}</p>`+renderMerge('dialog-');$('confirmDialog').textContent=t('ackDiff');$('confirmDialog').disabled=!writable()||m().trial!==m().revision||!!quickIssue();bindMerge($('dialogBody'),'dialog-')}return}
 const d=historyDocument,h=d.records[d.selected];$('dialog').classList.add('wide');$('dialogTitle').textContent=t('history')+' · '+t(d.process);$('confirmDialog').hidden=true;
 $('dialogBody').innerHTML=`<p class="small muted">${t('historyHelp')}</p><label>${t('fixedDocument')}<select id="history-select">${d.records.map((r,i)=>`<option value="${i}" ${d.selected===i?'selected':''}>${esc(r.id)} · ${t(r.kind)}</option>`).join('')}</select></label>${h?`<article id="history-record"><h3>${t(h.kind)}</h3><p class="mono">${esc(h.id)} / ${h.revision===null?'UNCOMMITTED':'r'+h.revision}</p><dl class="measurements"><dt>${t('evidenceScope')}</dt><dd>${esc(h.scope)} / ${h.target}</dd><dt>${t('sourceId')}</dt><dd>${esc(h.input)}</dd></dl><p>${t(h.note)}</p><p class="mono">${esc(h.facts)}</p>${h.params?`<h3>${t('snapshotParams')}</h3><p>${groupsFor(d.process).map(key=>prettyParams(d.process,h.params,key)).join('<br>')}</p><p class="small">${esc(h.source||'MANUAL')}</p>`:''}</article>`:`<p>${t('historyEmpty')}</p>`}<p class="small muted">${t('productionUnchanged')}</p>`;
 $('history-select').onchange=e=>{d.selected=+e.target.value;renderDialog()};
}
function openDialog(kind){$('dialog').classList.toggle('wide',kind==='history'||kind==='diff');openDialogBase(kind);if(kind==='history')$('history-select').focus()}
function render(){renderBase();renderLab()}

$('open-history').onclick=openHistory;

render();
</script>
</body>
