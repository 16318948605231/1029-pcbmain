function updateMarginInput(e){if(dialog?.kind!=='edit')return;dialog.margin=e.target.value;const invalid=parseMargin(dialog.margin)===null;e.target.setAttribute('aria-invalid',String(invalid));document.getElementById('edit-margin-error').textContent=invalid?T('decimalInvalid'):'';document.getElementById('confirm-edit').disabled=!writable()||invalid;}
function renderDialog(){const modal=document.getElementById('modal');if(!dialog){if(modal.open)modal.close();return;}const d=dialog;let title='record',body='';
 if(d.kind==='leave'){title='leave';body=`<p>${T('leaveHelp')}</p>${draft.pending?`<p class="callout">${T('unknownReceipt')}</p>`:''}<div class="dialogfoot">${btn('stay','stay')}${btn('discard-leave','discardLeave',!!draft.pending||!!run)}${btn('keep-leave','keepLeave',false,'primary')}</div>`;}
 if(d.kind==='edit'){title='edit';body=`<p>${T('editHelp')}</p><label class="field">${T('margin')} · mm<input id="edit-margin" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-describedby="edit-margin-help edit-margin-error" aria-invalid="${parseMargin(d.margin)===null}" value="${esc(d.margin)}"></label><p id="edit-margin-help" class="small">${T('decimalHelp')}</p><p id="edit-margin-error" class="small warn" role="status">${parseMargin(d.margin)===null?T('decimalInvalid'):''}</p><div class="dialogfoot">${btn('confirm-edit','confirm',!writable()||parseMargin(d.margin)===null,'primary')}</div>`;}
 if(d.kind==='lock'){title='lock';body=`<p>${T(d.key+'Group')}</p><label class="field">${T('reason')}<input id="lock-reason" value="${esc(d.reason)}"></label><div class="dialogfoot">${btn('confirm-lock','confirm',!writable()||!d.reason.trim(),'primary')}</div>`;}
 if(d.kind==='rebase'){title='rebase';body=`<p>${T('casConflict')}</p>${kv('revision',draft.expected+' → '+draft.remote)}<p class="small">${T('draftOnly')}</p><div class="dialogfoot">${btn('confirm-rebase','confirm',!writable(),'primary')}</div>`;}
 if(d.kind==='approval'){title='approval';body=`${kv('draft','r'+d.rev)}${kv('sourceEpoch',d.epoch)}${kv('scope',planCount()+' · '+T(q.process))}${planTable()}<p class="callout">${T('approvalHelp')}</p>${select('approval-response','response',['normal','lost'],d.response)}<div class="dialogfoot">${btn('send-approval','sendApproval',!canApproval()||d.rev!==draft.rev,'primary')}</div>`;}
 if(d.kind==='record'){title=d.record.kind;body=`${kv('record',d.record.id)}<p class="callout info">${T('fixedFacts')}</p><pre>${esc(JSON.stringify(d.record.data,null,2))}</pre>`;}
 if(d.kind==='review'){const r=reviewData(d.id);const obj=objects.find(o=>o.id===d.id);title='reviewTitle';body=`<p class="schema">${original.id} · ${d.id} · DEMO-ITEM-BODY</p><p class="callout info">${T('reviewHelp')}</p>${kv('reviewItem',T('reviewQuestion'))}${kv('selected',T(obj.kind))}<section class="casecard" id="review-evidence">${bodyEvidence(obj)}</section>${kv('claim',r.expired?T('expired'):r.claim?'DEMO-CLAIM-'+r.claim:T('unclaimed'))}<div class="toolbar">${btn('claim','claim',role!=='reviewer'||!!r.pending||!!r.submitted)}${btn('expire','expire',!r.claim||!!r.pending||!!r.submitted)}</div><div class="form" style="margin-top:16px">${select('review-outcome','outcome',obj.kind==='hidden'||obj.kind==='dnp'?['defer']:['defer','confirmDefect'],r.outcome,!reviewWritable(r))}<label class="field">${T('reason')}<textarea id="review-reason" ${!reviewWritable(r)?'disabled':''}>${esc(r.reason)}</textarea></label></div><p id="review-status" class="small" role="status">${T(r.pending?'reviewPending':r.submitted?'reviewReceived':r.expired?'reviewExpiredDraft':'draftOnly')}</p>${r.pending?`<p class="callout">${T('unknownReceipt')}<br>${r.pending.id}</p>${btn('query-review','query')}`:''}${d.preview?`<div class="casecard">${kv('outcome',T(r.outcome))}${kv('reason',esc(r.reason))}${select('review-response','response',['normal','lost'],d.response??'normal')}<div class="dialogfoot">${btn('submit-review','submitReview',!reviewWritable(r)||!r.reason.trim(),'primary')}</div></div>`:btn('preview-review','previewReview',!reviewWritable(r)||!r.reason.trim(),'primary')}`;}
 modal.innerHTML=`<div class="dialoghead"><h2>${T(title)}</h2><div class="toolbar">${select('dialog-lang','language',['zh-CN','zh-TW','en-US'],lang)}${btn('close-dialog','close')}</div></div><div class="body">${body}</div>`;if(!modal.open)modal.showModal();bindDialog();}
function navigate(next){if(next===mode)return;if(mode==='engineering'&&(draft.dirty||run||draft.pending)){openDialog({kind:'leave',next});return;}mode=next;render();}
function generate(){if(!writable()||!q.binding||q.frozen!==q.epoch)return;const B=clone(draft.base),L=clone(draft.params),R={geometry:{margin:.15,method:'DEMO-GEO/r2',datum:'DEMO-BOARD/r3'},identity:{text:'AB8',alternate:'DEMO-AVL-A/r2',pinmap:'DEMO-PINS/r2'}};q.candidate={B,L,R,rev:draft.rev,epoch:q.epoch,stale:false,applied:false,decisions:{}};for(const k of ['geometry','identity'])q.candidate.decisions[k]={choice:draft.locks[k]?'L':eq(L[k],B[k])?'R':eq(L[k],R[k])?'L':'',reason:draft.locks[k]};q.step=3;render();}
function applyMerge(){if(!canMerge())return;const c=q.candidate;draft.params={geometry:clone(c[c.decisions.geometry.choice].geometry),identity:clone(c[c.decisions.identity.choice].identity)};draft.base=clone(c.R);touch();c.rev=draft.rev;c.stale=false;c.applied=true;q.step=4;notice='Ready';render();}
function startTrial(){if(!canTrial())return;draft.trial=0;draft.reviewed=0;draft.handoff=0;const r={id:'DEMO-TRIAL-'+(++opSeq),rev:draft.rev,epoch:q.epoch,config:config(),observations:engineeringObservations(),cancelled:false};run=r;notice='Busy';render();setTimeout(()=>{const valid=!r.cancelled&&run===r&&draft.rev===r.rev&&q.epoch===r.epoch&&role==='engineer'&&canPlan();history.push({kind:valid?'trialRecord':'cancelRecord',id:r.id,data:{revision:r.rev,sourceEpoch:r.epoch,config:r.config,observations:clone(r.observations)}});if(run===r)run=null;if(valid){draft.trial=r.rev;notice='trialDone';}else notice='cancelled';render();},700);}
function cancelRun(){if(run){run.cancelled=true;notice='cancelled';}}
function saveDraft(lost=false){if(!writable())return;if(draft.expected!==draft.remote){conflict=true;notice='casConflict';render();return;}const request={kind:'save',id:'DEMO-SAVE-'+(++opSeq),revision:draft.rev,snapshot:config()};if(lost){draft.pending=request;notice='unknownReceipt';}else{savedConfig=request.snapshot;draft.savedRev=request.revision;draft.remote++;draft.expected=draft.remote;draft.dirty=false;notice='saved';}render();}
function querySave(){const p=draft.pending;if(!p)return;if(p.kind==='save'){savedConfig=clone(p.snapshot);draft.savedRev=p.revision;draft.remote++;draft.expected=draft.remote;draft.dirty=draft.rev!==p.revision;notice='saved';}else{draft.handoff=p.revision;history.push({kind:'approvalRecord',id:p.id,data:clone(p)});notice='received';}draft.pending=null;render();}
function action(id,fn,event='click'){const e=document.getElementById(id);if(e)e.addEventListener(event,fn);}
function bindEvents(){action('diagnostics',e=>{diagnosticsOpen=e.target.open;},'toggle');action('aside-refresh-source',()=>{if(writable()){sourceChanged();render();}});action('lang',e=>{lang=e.target.value;render();},'change');action('theme',()=>{theme=theme==='light'?'dark':'light';render();});action('role',e=>{role=e.target.value;if(role!=='engineer')cancelRun();render();},'change');for(const k of ['production','engineering','method','history'])action('view-'+k,()=>navigate(k));
 for(const el of document.querySelectorAll('[data-object]')){el.addEventListener('click',()=>selectObject(el.dataset.object));el.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&el.tagName.toLowerCase()==='g'){e.preventDefault();selectObject(el.dataset.object);}});}
 for(const el of document.querySelectorAll('[data-pin]')){el.addEventListener('click',()=>{selectedPin=Number(el.dataset.pin);detail='pins';render();});el.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&el.tagName.toLowerCase()==='g'){e.preventDefault();selectedPin=Number(el.dataset.pin);detail='pins';render();}});}
 action('search',e=>{query=e.target.value;filterChanged();},'input');action('side',e=>{side=e.target.value;filterChanged();},'change');action('clear-search',()=>{query='';side='all';selectionSeq++;loading=false;selected=objects[0].id;selectedPin=1;render();});action('mirror',e=>{mirror=e.target.checked;render();},'change');for(const k of ['overview','local','section'])action('image-'+k,()=>{imageTab=k;render();});for(const k of ['body','pins','solder'])action('detail-'+k,()=>{detail=k;render();});action('next',()=>{const list=filtered();selectObject(list[(list.findIndex(o=>o.id===selected)+1)%list.length].id);});action('open-review',()=>{if(current())openDialog({kind:'review',id:selected});});
 for(let i=0;i<8;i++)action('step-'+i,()=>{q.step=i;render();});for(const key of ['cad','pnp'])action('import-'+key,()=>{if(!writable())return;q[key]=true;sourceChanged();render();});action('correct-source',()=>{if(!writable()||!q.cad||!q.pnp)return;q.reconciled=true;sourceChanged();render();});action('refresh-source',()=>{if(writable()){sourceChanged();render();}});action('process',e=>{if(writable()){q.process=e.target.value;sourceChanged();render();}},'change');action('freeze',()=>{if(!writable()||!q.reconciled||!q.cad||!q.pnp)return;touch();q.frozen=q.epoch;q.intent=null;q.binding=false;q.step=1;render();});action('intent',e=>{if(writable()){q.pendingIntent=e.target.value;render();}},'change');action('confirm-intent',()=>{if(!writable()||q.frozen!==q.epoch)return;q.intent=q.pendingIntent;q.binding=false;touch();q.step=2;render();});action('package',e=>{if(writable()){q.package=e.target.value;q.binding=false;touch();render();}},'change');action('bind',()=>{if(!writable()||q.package!=='A'||!q.intent||q.frozen!==q.epoch)return;q.binding=true;touch();q.step=3;render();});action('generate',generate);action('regenerate',generate);action('apply-merge',applyMerge);
 for(const key of ['geometry','identity']){action('choice-'+key,e=>{if(writable()&&q.candidate&&!q.candidate.stale){q.candidate.decisions[key].choice=e.target.value;render();}},'change');action('reason-'+key,e=>{if(writable()&&q.candidate){q.candidate.decisions[key].reason=e.target.value;render();}},'input');action('lock-'+key,()=>{if(!writable())return;if(draft.locks[key]){draft.locks[key]='';touch();render();}else openDialog({kind:'lock',key,reason:''});});}
 action('edit',()=>{if(writable())openDialog({kind:'edit',margin:String(draft.params.geometry.margin)});});action('input',e=>{if(writable()){q.input=e.target.value;touch();if(q.candidate?.applied){q.candidate.rev=draft.rev;q.candidate.stale=false;}render();}},'change');action('confirm-plan',()=>{if(writable()&&canPlan()){q.plan=draft.rev;q.step=5;notice='Ready';render();}});action('trial',startTrial);action('cancel',()=>{cancelRun();render();});action('step-review',()=>{q.step=6;render();});action('ack',()=>{if(writable()&&draft.trial===draft.rev){draft.reviewed=draft.rev;render();}});action('to-handoff',()=>{q.step=7;render();});for(const id of ['save','footer-save'])action(id,()=>saveDraft());action('save-unknown',()=>saveDraft(true));action('query-save',querySave);action('cas',()=>{if(writable()){draft.remote++;render();}});action('rebase',()=>openDialog({kind:'rebase'}));action('approval',()=>{if(canApproval())openDialog({kind:'approval',rev:draft.rev,epoch:q.epoch,response:'normal'});});
 for(const [id,key] of [['lab-body','body'],['lab-bridge','bridge'],['correspondence','correspondence']])action(id,e=>{lab[key]=e.target.value;render();},'change');for(const k of ['lower','upper'])action('graph-'+k,()=>{lab.graph=k;render();});action('new-card',()=>{history.push({kind:'investigationRecord',id:'DEMO-LAB-'+(++opSeq),data:clone(lab)});notice='Completed';render();});history.forEach((h,i)=>action('record-'+i,()=>openDialog({kind:'record',record:clone(h)})));
}
function bindDialog(){action('close-dialog',()=>{closeDialog();render();});action('dialog-lang',e=>{lang=e.target.value;render();},'change');action('stay',()=>{closeDialog();render();});action('keep-leave',()=>{const next=dialog.next;cancelRun();closeDialog();mode=next;render();});action('discard-leave',()=>{if(draft.pending||run)return;const next=dialog.next;const restored=clone(savedConfig),epoch=q.epoch;q=restored.q;q.epoch=Math.max(epoch,q.epoch)+1;q.frozen=0;q.intent=null;q.binding=false;draft.params=restored.params;draft.base=restored.base;draft.locks=restored.locks;touch();draft.dirty=false;notice='restoreHelp';closeDialog();mode=next;render();});action('edit-margin',updateMarginInput,'input');action('confirm-edit',()=>{if(!writable()||dialog.kind!=='edit')return;const n=parseMargin(dialog.margin);if(n===null)return;draft.params.geometry.margin=n;touch();closeDialog();render();});action('lock-reason',e=>{dialog.reason=e.target.value;render();},'input');action('confirm-lock',()=>{if(!writable()||!dialog.reason.trim())return;draft.locks[dialog.key]=dialog.reason.trim();touch();closeDialog();render();});action('confirm-rebase',()=>{if(writable()){draft.expected=draft.remote;conflict=false;closeDialog();render();}});action('approval-response',e=>{dialog.response=e.target.value;render();},'change');action('send-approval',()=>{if(!canApproval()||dialog.rev!==draft.rev)return;const req={kind:'approval',id:'DEMO-APPROVAL-'+(++opSeq),revision:draft.rev,epoch:q.epoch,snapshot:config()};if(dialog.response==='lost'){draft.pending=req;notice='unknownReceipt';}else{draft.handoff=draft.rev;history.push({kind:'approvalRecord',id:req.id,data:req});notice='received';}closeDialog();render();});
 if(dialog.kind==='review'){const r=reviewData(dialog.id);action('claim',()=>{if(role==='reviewer'&&!r.pending&&!r.submitted){r.claim=++opSeq;r.expired=false;dialog.preview=false;render();}});action('expire',()=>{r.expired=true;dialog.preview=false;render();});action('review-outcome',e=>{if(reviewWritable(r)){r.outcome=e.target.value;dialog.preview=false;render();}},'change');action('review-reason',e=>{if(reviewWritable(r)){r.reason=e.target.value;dialog.preview=false;render();}},'input');action('preview-review',()=>{if(reviewWritable(r)&&r.reason.trim()){dialog.preview=true;dialog.response='normal';render();}});action('review-response',e=>{dialog.response=e.target.value;render();},'change');action('submit-review',()=>{if(!reviewWritable(r)||!r.reason.trim()||!dialog.preview)return;const req={id:'DEMO-REVIEW-'+(++opSeq),item:dialog.id,claim:r.claim,outcome:r.outcome,reason:r.reason,source:original.id};if(dialog.response==='lost')r.pending=req;else{r.submitted=req;history.push({kind:'reviewRecord',id:req.id,data:clone(req)});}dialog.preview=false;render();});action('query-review',()=>{if(r.pending){r.submitted=clone(r.pending);history.push({kind:'reviewRecord',id:r.pending.id,data:clone(r.pending)});r.pending=null;render();}});}
}
document.getElementById('modal').addEventListener('cancel',e=>{e.preventDefault();closeDialog();render();});
window.aoiSnapshot=()=>clone({lang,theme,role,mode,selected,selectedPin,detail,imageTab,query,side,mirror,loading,selectionSeq,q,draft,run,lab,history,reviews,original,dialog,opSeq,state:state()});
render();
</script></body></html>
