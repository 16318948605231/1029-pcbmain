function metric(key,value,unit='',id='',wide=false){return `<div class="metric ${wide?'wide':''}" ${id?`id="${id}"`:''}><small>${T(key)}</small><strong>${esc(value)}</strong><span>${esc(unit)}</span></div>`;}
function kv(key,value){return `<div class="kv"><span>${T(key)}</span><b>${esc(value)}</b></div>`;}
function panel(key,body,extra='',cls=''){return `<section class="panel ${cls}"><div class="panelhead"><h3>${T(key)}</h3>${extra}</div><div class="body">${body}</div></section>`;}
function mainHeading(key,sub,actions=''){return `<div class="heading"><div><h2>${T(key)}</h2><p>${T(sub)}</p></div><div class="toolbar">${actions}</div></div>`;}
function visiblePads(){return pads.filter(p=>(!query||p.id.toLowerCase().includes(query.toLowerCase()))&&(!onlyIssues||!['complete','excluded'].includes(p.status)));}
function empty(){return `<div class="empty">${T('noSelection')}<p>${btn('clear-search','clear')}</p></div>`;}
function selectedPad(){return fixture==='Empty'||loading?null:pads.find(p=>p.id===selected);}
function render(){
 const active=document.activeElement;const focusId=active?.id;const selStart=active?.selectionStart;const scroll=window.scrollY;
 document.documentElement.lang=lang;document.body.className=theme==='light'?'light':'';
 document.getElementById('app').innerHTML=`<header><div class="brand"><div class="logo">SPI</div><div><p class="eyebrow">${T('subtitle')}</p><h1>${T('app')}</h1></div></div><div class="controls"><label>${T('language')}<select id="lang">${langs.map(l=>`<option ${l===lang?'selected':''}>${l}</option>`).join('')}</select></label><label>${T('role')}<select id="role">${opt('operator','operator',role)+opt('engineer','engineer',role)}</select></label><label>${T('state')}<select id="state">${['Ready','Busy','Empty','Stale','Blocked','RecoverableError','PermissionDenied','Completed'].map(k=>opt(k,k,fixture)).join('')}</select></label>${btn('theme','theme')}</div></header><div class="context"><div><small>${T('board')}</small><strong>DEMO-B0042 · PRINT-02</strong></div><div><small>${T('program')}</small><strong>SPI-P17 / r7</strong></div><div><small>${T('station')}</small><strong>DEMO-SPI / L1</strong></div><div><small>${T('source')}</small><strong>${tab==='production'?'DEMO-SPI-ORIGINAL-r7':tab==='method'?'DEMO-METHOD':tab==='history'?'DEMO-HISTORY':'DEMO-DRAFT-r'+draft.rev}</strong></div><span class="tag warn">${T('scope')}</span></div><nav aria-label="${T('viewScope')}">${['production','programming','method','history'].map(k=>btn('view-'+k,k,false,k===tab?'active':'')).join('')}</nav><main>${tab==='production'?productionHtml():tab==='programming'?programHtml():tab==='method'?methodHtml():historyHtml()}</main><footer><div><strong>${run?T(run.cancel?'draining':'Busy'):T(fixture)} · ${T(tab)} ${tab==='programming'?'r'+draft.rev:''}</strong><small role="status" id="status-message">${T(notice)}</small></div><div class="toolbar">${tab==='programming'?btn('footer-save','save',!writable())+(run?btn('footer-cancel','cancel',run.cancel):''):btn('footer-next','next',tab!=='production')}</div></footer>${dialog?dialogHtml():''}`;
 bind();if(focusId){const n=document.getElementById(focusId);if(n){n.focus({preventScroll:true});if(typeof selStart==='number'&&n.setSelectionRange&&['text','search'].includes(n.type))n.setSelectionRange(selStart,selStart);}}window.scrollTo(0,scroll);
}
function targetHtml(){return `<input id="search" type="search" aria-label="${T('search')}" placeholder="${T('search')}" value="${esc(query)}"><div class="toolbar" style="margin-top:8px">${btn('filter-all','all',false,!onlyIssues?'active':'')}${btn('filter-issues','issues',false,onlyIssues?'active':'')}</div><div class="targets">${visiblePads().map(p=>`<div><button class="target ${selected===p.id?'active':''}" data-target="${p.id}" id="target-${p.id.replaceAll('/','-')}"><strong>${esc(p.label)} <span class="dot">${p.status==='complete'?'◇':'△'}</span></strong><small>${p.id}</small><small>${T(p.dnp?'dnp':p.status)}</small></button>${selected===p.id?`<div class="children">${p.aps.map(a=>`<button data-aperture="${a}" class="${subwindow===a?'active':''}">${a}</button>`).join('')}</div>`:''}</div>`).join('')}</div><p class="hint">${T('fixedCount')}</p>`;}
function boardSvg(){const current=selectedPad();return `<div class="viewport"><div class="viewcaption">DEMO · TOP · mm · ${heightView?T('heightView'):'2D'}</div><svg viewBox="0 0 750 440" role="img" aria-label="${T('image')}"><defs><pattern id="boardGrid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#244047" stroke-width=".5"/></pattern><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9L9 0" stroke="#e8b65d" stroke-width="2"/></pattern><linearGradient id="paste" x2="0" y2="1"><stop stop-color="#8ed9d6"/><stop offset="1" stop-color="#3c8c99"/></linearGradient></defs><rect width="750" height="440" fill="url(#boardGrid)"/><g transform="${layers.mirror?'translate(750 0) scale(-1 1)':''}"><rect x="45" y="50" width="660" height="350" rx="18" fill="#183c3c" stroke="#3c7970" stroke-width="2"/><path d="M70 350H105V205H320V360H680M110 80V160H285V70M520 70V210H655V360" stroke="#377572" stroke-width="6" fill="none" opacity=".35"/>${pads.map(p=>`<g data-pad="${p.id}" tabindex="0" role="button" aria-label="${p.id}"><rect x="${p.x-15}" y="${p.y-16}" width="100" height="92" rx="8" fill="none" stroke="${current?.id===p.id?'#55bbff':'transparent'}" stroke-width="2"/><rect x="${p.x}" y="${p.y}" width="65" height="55" rx="3" fill="#c7b77b" opacity=".85"/>${tab==='programming'?`<rect x="${p.x-draft.params.acquisition.margin*100}" y="${p.y-draft.params.acquisition.margin*100}" width="${65+draft.params.acquisition.margin*200}" height="${55+draft.params.acquisition.margin*200}" fill="none" stroke="#ffcb6a" stroke-dasharray="3 4"/>`:''}${layers.windows?p.aps.map((a,i)=>`<rect data-window="${a}" x="${p.x+4+i*30}" y="${p.y+5}" width="${p.aps.length>1?24:55}" height="45" fill="none" stroke="${subwindow===a?'#fff':'#89daff'}" stroke-width="${subwindow===a?3:1}" stroke-dasharray="4 3"/>`).join(''):''}${layers.paste&&p.component&&p.component!=='C-B23'?`<rect x="${p.x+(p.status==='shifted'?16:3)}" y="${p.y+6-(heightView?zscale*4:0)}" width="${p.status==='heightUnknown'?58:65}" height="43" rx="10" fill="url(#paste)" opacity=".85"/>`:''}${layers.unknown&&p.status==='heightUnknown'?`<rect x="${p.x+25}" y="${p.y}" width="30" height="55" fill="url(#hatch)"/>`:''}<text x="${p.x}" y="${p.y+78}" font-size="11">${p.id}</text></g>`).join('')}${layers.paste?'<path data-component="C-B23" d="M376 122 Q400 111 421 126 L457 126 Q480 111 510 126 L510 151 Q483 170 457 150 L421 150 Q397 167 376 151Z" fill="url(#paste)" opacity=".92"/>':''}<line x1="${current?.x??150}" x2="${(current?.x??150)+80}" y1="${(current?.y??100)+section*55}" y2="${(current?.y??100)+section*55}" stroke="#ffa869" stroke-dasharray="5 3"/></g></svg></div>`;}
function sectionSvg(){const p=selectedPad();const unknown=!p||p.volume===null;return `<svg class="sectionplot" viewBox="0 0 650 150" aria-label="${T('section')}"><path d="M40 20V120H620" stroke="var(--line)" fill="none"/><path d="M40 110H620" stroke="var(--accent)" stroke-dasharray="4 4"/><text x="4" y="25">mm</text><text x="500" y="138">${esc(p?.id??'—')}</text>${unknown?`<rect x="180" y="35" width="200" height="72" fill="var(--warn)" opacity=".1"/><text x="190" y="75">${T('unmeasured')}</text>`:`<path d="M80 110 L175 110 Q205 ${52+section*20} 260 ${45+section*20} L370 ${45+section*20} Q425 60 445 110 L580 110" fill="none" stroke="var(--good)" stroke-width="3"/><text x="275" y="28">0.100 mm · ${T('ref')}</text>`}</svg>`;}
function productionHtml(){const p=selectedPad();const n=loading?T('loading'):T('noSelection');const values=p?`<p class="hint">${esc(p.id)} · ${p.group??'—'} · ${subwindow??p.aps.join(' / ')}</p><div class="metrics">${metric('areaRatio',p.area===null?T('notApplicable'):p.id==='I1/U1/P1'?'100.0':p.id==='I2/U1/P1'?'100.0':'—','%', 'prod-area')}${metric('coverage',p.area===null?T('notApplicable'):p.id==='I1/U1/P1'?'75.0':p.status==='heightUnknown'?'100.0':p.status==='complete'?'100.0':'96.0','%','prod-coverage')}${metric('volume',p.volume===null?T(p.status==='excluded'?'notApplicable':'unmeasured'):p.volume.toFixed(3),'mm³','prod-volume')}${metric('overflow',p.id==='I1/U1/P1'?'0.250':p.status==='excluded'?'—':'—','mm²')}</div>${kv('denominator',p.id==='I1/U1/P1'?'DEMO-PAD/r1 · 1.000 mm²':p.aps.join(' / ')||'—')}${kv('ref','DEMO-COPPER/r2')}${kv('reason',T(p.status))}<p class="callout">${T(p.id==='I1/U1/P1'?'ratioExplain':p.status==='bridgeCandidate'?'oneBridge':p.status==='heightUnknown'?'heightUnknown':'evidenceOnly')}</p>${btn('open-evidence','evidence')}`:`<p class="empty">${n}</p>`;
 return mainHeading('production','prodSub',btn('open-feedback','feedback')+btn('query-commit','queryCommit'))+`<div class="workbench">${panel('targets',targetHtml())}<div class="stack"><section class="panel"><div class="panelhead"><h3>${T('image')}</h3><span class="tag">5 / 6 · ${T('required')}</span></div><div class="body toolbar">${['paste','windows','unknown','mirror'].map(k=>`<label class="hint"><input type="checkbox" id="layer-${k}" ${layers[k]?'checked':''}> ${T({paste:'overlay',windows:'windows',unknown:'unknownLayer',mirror:'mirror'}[k])}</label>`).join('')}${btn('height-view','heightView',false,heightView?'active':'')}</div>${fixture==='Empty'||!selected?empty():boardSvg()}<div class="legend"><span><i></i>${T('pad')}</span><span><i style="background:var(--good)"></i>${T('paste')}</span><span><i style="background:var(--warn)"></i>U_h</span></div></section>${panel('section',sectionSvg()+`<label class="field">${T('sectionAt')} · ${(section*100).toFixed(0)}%<input id="section" type="range" min="0" max="1" step=".05" value="${section}"></label>`+(heightView?`<label class="field">${T('zscale')} · ${zscale}×<input id="zscale" type="range" min="1" max="5" value="${zscale}"></label>`:'')+`<p class="hint">${T('visualOnly')}</p>`)}</div>${panel('inspect',values,'','inspector')}</div><div class="row2">${panel('relation',`<p id="relation-summary">${T('oneBridge')}</p><div class="toolbar">${btn('select-bridge','bridgeCandidate')}${btn('investigate-bridge','bridgeTab')}</div>`)}${panel('dimensions',kv('structure','DEMO-H0 · '+T('complete'))+kv('measurable','I1/R9/P1 · '+T('heightUnknown'))+kv('commitState','DEMO-COMMIT-42 · '+T('submitted'))+`<p class="hint">${T('productionLimit')}</p>`)}</div>`;}
function parameterFields(group){return Object.entries(group).map(([k,v])=>{const keys={route:'route',reference:'ref',domain:'domain',margin:'margin',method:'methodLabel',source:'sourceRev',intent:'intent',pads:'required',apertures:'apertures',denominator:'denominator'};return kv(keys[k],['reference','domain','intent'].includes(k)?T(v):k==='margin'?v+' mm':v);}).join('');}
function canMerge(){const c=q.candidate;if(!writable()||!c||c.stale||c.rev!==draft.rev||c.source!==q.sourceRev)return false;for(const key of ['acquisition','targets']){const decision=c.decisions[key];if(!decision.choice)return false;if(draft.locks[key]&&decision.choice!=='L')return false;const conflict=!same(c.B[key],c.L[key])&&!same(c.B[key],c.R[key])&&!same(c.L[key],c.R[key]);if((conflict||decision.choice==='L'&&!same(c.L[key],c.R[key]))&&!decision.reason.trim())return false;}return c[c.decisions.targets.choice].targets.intent===q.intent;}
function mergeHtml(){const c=q.candidate;if(!c)return `<p class="hint">${T('candidateOnly')}</p>`;return `<div id="merge-area">${c.stale?`<p class="callout">${T('staleCandidate')}</p>`:''}${['acquisition','targets'].map(key=>`<div class="merge"><div class="mergetitle"><strong>${T(key==='acquisition'?'acqGroup':'targetGroup')}</strong><div class="hint">${T(draft.locks[key]?'locked':'inherited')} ${esc(draft.locks[key])}</div></div><div class="three">${['B','L','R'].map(side=>`<div><h4>${side}</h4>${parameterFields(c[side][key])}<details><summary>${T('diagnostics')}</summary><pre>${esc(JSON.stringify(c[side][key],null,2))}</pre></details></div>`).join('')}</div><div class="toolbar"><label class="field">${T('choose')}<select id="choice-${key}" ${!writable()?'disabled':''}><option value="">${T('choose')}</option><option value="L" ${c.decisions[key].choice==='L'?'selected':''}>${T('keepL')}</option><option value="R" ${c.decisions[key].choice==='R'?'selected':''} ${draft.locks[key]?'disabled':''}>${T('takeR')}</option></select></label><label class="field" style="flex:1">${T('lockReason')}<input id="reason-${key}" type="text" value="${esc(c.decisions[key].reason)}" ${!writable()?'disabled':''}></label>${btn('lock-'+key,draft.locks[key]?'unlock':'lock',!writable())}</div><div class="hint" style="padding:0 12px 12px">${T('conflict')}</div></div>`).join('')}${c.decisions.targets.choice&&c[c.decisions.targets.choice].targets.intent!==q.intent?`<p id="intent-error" class="callout">${T('intentMismatch')}</p>`:''}<div class="toolbar" style="margin-top:16px">${btn('apply-merge','merge',!canMerge(),'primary')}${btn('regenerate','generate',!writable()||!q.mapped)}</div></div>`;}
function programHtml(){let body='';
 if(q.step===0)body=`<div class="form">${select('source','source',['design','referenceImage','legacy'],q.source)}${select('actual','actual',['available','missing3d','conflicting'],q.actual)}</div><p class="hint">DEMO-${q.source.toUpperCase()} / r${q.sourceRev} · TOP · mm · 5 / 7</p>${q.source==='referenceImage'?`<p class="callout">${T('imageLimit')}</p>`:''}<div class="toolbar">${btn('freeze','freeze',!writable(),'primary')}${btn('refresh-source','refreshSource',!writable())}</div>`;
 if(q.step===1)body=`<div class="form">${select('intent','intent',['volumeRequired','areaOnly'],q.pendingIntent)}</div><p class="callout">${T('dnp')} · R9/P1</p><p>${T('required')}: 5 · ${T('apertures')}: 7</p><div class="toolbar">${btn('confirm-intent','confirmIntent',!writable()||!q.frozen,'primary')}${q.source==='referenceImage'?btn('bind-design','bindDesign',!writable()||!q.frozen):''}</div><p class="hint">${T('confirm')}: ${q.intent?T(q.intent):T('notConfirmed')} · ${q.bound?'DEMO-DESIGN/r1':'—'}</p>`;
 if(q.step===2)body=`${select('mapping','mapping',['explicit','ambiguous'],q.mapping)}${boardSvg()}<p class="callout info">${T('mappingHint')}</p><div class="tablewrap"><table><thead><tr><th>${T('pad')}</th><th>${T('apertures')}</th><th>${T('group')}</th></tr></thead><tbody>${pads.map(p=>`<tr><td>${p.id}</td><td>${p.aps.join(' / ')||T('excluded')}</td><td>${p.group||'—'}</td></tr>`).join('')}</tbody></table></div><p>${btn('confirm-mapping','confirmMapping',!writable()||!q.frozen||!q.intent||q.mapping!=='explicit'||q.source==='referenceImage'&&!q.bound,'primary')}</p>`;
 if(q.step===3)body=`<p>${T('candidateOnly')}</p><div class="toolbar">${btn('generate','generate',!writable()||!q.mapped||!q.frozen,'primary')}${btn('edit','edit',!writable())}</div>${boardSvg()}<p class="hint">${T('searchPreview')}</p>${parameterFields(draft.params.acquisition)}`;
 if(q.step===4)body=`<div class="metrics">${metric('required','5','pad')}${metric('apertures','7','aperture')}${metric('route',draft.params.acquisition.route)}${metric('actual',T(q.actual))}</div><p class="callout ${qualify()?'info':''}">${T(qualify()?'candidateOnly':'qualGap')}</p><p class="hint">${T('actualMismatch')}</p>${btn('confirm-plan','plan',!writable()||!q.candidate?.applied,'primary')}`;
 if(q.step===5)body=`${kv('intent',q.intent?T(q.intent):T('notConfirmed'))}${kv('actual',T(q.actual))}${kv('draft','r'+draft.rev)}${!qualify()?`<p class="callout">${T('qualGap')}</p>`:''}<p>${T('trialLimit')}</p>${run?'<div class="progress"><i></i></div>':''}<div class="toolbar">${btn('validate','validate',!writable()||q.plan!==draft.rev)}${btn('trial','trial',!writable()||!qualify()||draft.validated!==draft.rev||q.plan!==draft.rev,'primary')}${btn('cancel','cancel',!run||run.cancel)}</div>`;
 if(q.step===6)body=mergeHtml()+`<div class="toolbar" style="margin-top:16px">${btn('edit','edit',!writable())}${btn('ack-review','ack',!writable()||!qualify()||draft.trial!==draft.rev||q.plan!==draft.rev,'primary')}</div>`;
 if(q.step===7)body=`<p class="callout info">${T('handoffLimit')}</p>${kv('draft','r'+draft.rev)}${kv('save','r'+draft.savedRev)}${kv('trial','r'+draft.trial)}${kv('stage6','r'+draft.reviewed)}<div class="toolbar">${btn('final-save','save',!writable())}${btn('handoff','handoff',!canHandoff(),'primary')}</div>`;
 return mainHeading('programming','programSub')+`<div class="steps">${Array.from({length:8},(_,i)=>`<button id="step-${i}" class="${q.step===i?'active':''}"><b>P${i}</b>${T('stage'+i)}</button>`).join('')}</div><div class="program">${panel('stage'+q.step,body,`<span class="tag">DEMO-DRAFT-r${draft.rev}</span>`)}<div class="stack">${panel('draft',kv('source',q.source+' / r'+q.sourceRev)+kv('intent',q.intent?T(q.intent):T('notConfirmed'))+kv('stage4','r'+q.plan)+kv('validate','r'+draft.validated)+kv('trial','r'+draft.trial)+kv('stage6','r'+draft.reviewed)+kv('stage7','r'+draft.handoff)+`<p class="hint">${T('handoffLimit')}</p>`)}${panel('save',`<p class="hint">CAS ${draft.expected} / ${draft.remote}</p>${draft.expected!==draft.remote?`<p class="callout">${T('casConflict')}</p>`:''}${draft.pendingSave?`<p class="callout">${T('savePending')} · ${draft.pendingSave.id}</p>`:''}<div class="toolbar">${btn('save','save',!writable())}${btn('cas','cas',!writable())}${btn('rebase','rebase',!writable()||draft.expected===draft.remote)}${btn('save-unknown','saveUnknown',!writable()||draft.expected!==draft.remote)}${btn('query-save','querySave',!draft.pendingSave)}</div>`)}</div></div>`;
}
function materialData(){const kind=lab.material;let F=.4,B=.6,Us=0,Uh=0;if(kind==='materialUnknown'){F=.5;B=.25;Us=.25;}if(kind==='heightHole'){F=.4;B=.6;Uh=.2;}if(kind==='allB'){F=0;B=1;}if(kind==='allU'){F=0;B=0;Us=1;}const EF=F-Uh,delta=lab.bias,has=EF+B>0;let signed=EF*(.2-delta),plus=EF*Math.max(.2-delta,0);if(lab.domain==='geometry'){signed=(EF+B)*(.2-delta);plus=(EF+B)*Math.max(.2-delta,0);}return {F,B,Us,Uh,EF,signed:has?signed:null,plus:has?plus:null,complete:Us===0&&Uh===0,negative:EF>0&&delta>.2};}

function generate(){if(!writable()||!q.frozen||!q.intent||!q.mapped||q.frozen.rev!==q.sourceRev)return;const R=clone(draft.base);R.acquisition={...R.acquisition,margin:.15,method:'DEMO-M2',source:q.sourceRev};R.targets={...R.targets,intent:q.intent,source:q.sourceRev};const c={B:clone(draft.base),L:clone(draft.params),R,rev:draft.rev,source:q.sourceRev,stale:false,applied:false,decisions:{}};for(const key of ['acquisition','targets']){const conflict=!same(c.B[key],c.L[key])&&!same(c.B[key],c.R[key])&&!same(c.L[key],c.R[key]);c.decisions[key]={choice:draft.locks[key]?'L':conflict?'':same(c.R[key],c.B[key])?'L':'R',reason:draft.locks[key]||''};}q.candidate=c;q.step=6;render();}
function applyMerge(){if(!canMerge())return;const c=q.candidate;draft.params={acquisition:clone(c[c.decisions.acquisition.choice].acquisition),targets:clone(c[c.decisions.targets.choice].targets)};draft.base=clone(c.R);touch();c.applied=true;q.step=4;notice='candidateOnly';render();}
function runTrial(){if(!writable()||!qualify()||draft.validated!==draft.rev||q.plan!==draft.rev)return;draft.trial=draft.reviewed=draft.handoff=0;const r={id:'DEMO-SPI-TRIAL-'+(++runSeq),cancel:false,snapshot:{params:clone(draft.params),q:clone(q),revision:draft.rev,actual:q.actual}};run=r;notice='Busy';render();setTimeout(()=>{if(run!==r)return;const valid=!r.cancel&&role==='engineer'&&fixture!=='PermissionDenied'&&draft.rev===r.snapshot.revision&&qualify();records.push({kind:valid?'trialRecord':'cancelRecord',id:r.id,revision:r.snapshot.revision,data:clone(r.snapshot)});run=null;if(valid){draft.trial=r.snapshot.revision;notice='runComplete';}else{notice='statusHelp';}render();},650);}
function savedSnapshot(){return {params:clone(draft.params),base:clone(draft.base),locks:clone(draft.locks)};}
function saveDraft(unknown=false){if(!writable())return false;if(draft.expected!==draft.remote){notice='casConflict';render();return false;}const snap=savedSnapshot();const identity='DEMO-SAVE-'+(++draft.saveId);draft.remote++;if(unknown){draft.pendingSave={id:identity,snapshot:snap,revision:draft.rev,remote:draft.remote};notice='savePending';}else{draft.saved=snap;draft.savedRev=draft.rev;draft.expected=draft.remote;draft.dirty=false;notice='saved';}render();return true;}

 }
 action('lock-reason',e=>{if(dialog?.kind==='lock'){dialog.reason=e.target.value;render();}},'input');
 action('confirm-lock',()=>{if(!writable()||dialog?.kind!=='lock'||!dialog.reason.trim())return;draft.locks[dialog.key]=dialog.reason.trim();touch();candidateStale();closeDialog();});
 action('edit',()=>{if(writable())openDialog({kind:'edit',form:clone(draft.params.acquisition)});});
 action('edit-margin',e=>{dialog.form.margin=e.target.value;render();},'input');
 for(const [id,key] of [['edit-route','route'],['edit-ref','reference'],['edit-domain','domain']])action(id,e=>{dialog.form[key]=e.target.value;render();},'change');
 action('confirm-edit',()=>{if(!writable()||dialog?.kind!=='edit')return;const margin=Number(dialog.form.margin);if(!Number.isFinite(margin)||margin<0||margin>1)return;draft.params.acquisition={...clone(dialog.form),margin};touch();candidateStale();closeDialog();});
 action('confirm-plan',()=>{if(!writable()||!q.candidate?.applied)return;q.plan=draft.rev;q.step=5;render();});
 action('validate',()=>{if(!writable()||q.plan!==draft.rev)return;if(qualify()){draft.validated=draft.rev;notice='passedConfig';}else{invalidate();notice='qualGap';}render();});
 action('trial',runTrial);for(const id of ['cancel','footer-cancel'])action(id,cancelRun);
 action('ack-review',()=>{if(!writable()||!qualify()||draft.trial!==draft.rev||q.plan!==draft.rev)return;draft.reviewed=draft.rev;q.step=7;notice='reviewAck';render();});
 for(const id of ['save','footer-save','final-save'])action(id,()=>saveDraft());
 action('save-unknown',()=>saveDraft(true));action('query-save',()=>{const p=draft.pendingSave;if(!p)return;draft.saved=clone(p.snapshot);draft.savedRev=p.revision;draft.expected=p.remote;draft.dirty=draft.rev!==p.revision;draft.pendingSave=null;notice='saved';render();});
 action('cas',()=>{if(!writable())return;draft.remote++;notice='casConflict';render();});action('rebase',()=>{if(writable()&&draft.remote!==draft.expected)openDialog({kind:'remote'});});
 action('confirm-rebase',()=>{if(!writable()||dialog?.kind!=='remote')return;draft.expected=draft.remote;touch();candidateStale();closeDialog();});
 action('handoff',()=>{if(canHandoff())openDialog({kind:'handoff',rev:draft.rev});});action('confirm-handoff',()=>{if(!canHandoff()||dialog?.rev!==draft.rev)return;draft.handoff=draft.rev;notice='handoffLimit';closeDialog();});
 action('close-dialog',closeDialog);
 action('keep-leave',()=>{const next=dialog.next;if(run)cancelRun();tab=next;closeDialog();});
 action('save-leave',()=>{if(!writable()||dialog?.kind!=='leave')return;const next=dialog.next;if(saveDraft()){tab=next;closeDialog();}});
 action('discard-leave',()=>{if(!writable()||dialog?.kind!=='leave')return;const next=dialog.next;const saved=clone(draft.saved);draft.params=saved.params;draft.base=saved.base;draft.locks=saved.locks;touch();draft.savedRev=draft.rev;draft.dirty=false;q.frozen=null;q.intent=null;q.mapped=false;q.bound=false;q.candidate=null;tab=next;closeDialog();});
 for(const k of ['materialTab','acqTab','bridgeTab','centerTab'])action('labtab-'+k,()=>{lab.tab=k;render();});
 for(const [id,key] of [['lab-material','material'],['lab-domain','domain'],['lab-acq','acq'],['lab-bridge','bridge'],['lab-permit','permit'],['lab-center','center'],['lab-reference','reference']])action(id,e=>{lab[key]=e.target.value;render();},'change');
 action('lab-route',e=>{lab.route=e.target.value;lab.acq='fullSet';render();},'change');action('lab-bias',e=>{lab.bias=Number(e.target.value);render();},'input');
 for(const graph of ['lower','upper'])action('graph-'+graph,()=>{lab.graph=graph;render();});
 action('add-preview',()=>{records.push({kind:'preview',id:'DEMO-SPI-PREVIEW-'+records.length,revision:draft.rev,data:{lab:clone(lab),params:clone(draft.params),q:clone(q),unsubmitted:true}});notice='preview';render();});
 records.forEach((r,i)=>action('history-'+i,()=>openDialog({kind:'record',record:clone(r)})));
 action('feedback-fixture',e=>{feedbackFixture=e.target.value;feedbackQueries=0;render();},'change');action('query-command',()=>{feedbackQueries++;notice='queryResult';render();});
 if(tab==='programming'&&!writable())for(const id of ['source','actual','intent','mapping','edit-margin','edit-route','edit-ref','edit-domain','lock-reason']){const el=document.getElementById(id);if(el)el.disabled=true;}
}
document.addEventListener('keydown',e=>{if(dialog){if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){const nodes=[...document.querySelectorAll('.dialog button:not(:disabled),.dialog select:not(:disabled),.dialog input:not(:disabled),.dialog summary')];const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}return;}if(e.altKey&&['1','2','3','4'].includes(e.key)){e.preventDefault();navigate(['production','programming','method','history'][Number(e.key)-1]);}});
window.spiSnapshot=()=>clone({lang,role,theme,fixture,tab,selected,subwindow,loading,query,onlyIssues,layers,section,zscale,q,draft,run,lab,records,original,dialog,feedbackFixture,feedbackQueries});
render();

</script></body></html>
